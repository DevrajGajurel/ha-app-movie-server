<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Movie Server</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --danger: #ff6b6b;
      --success: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .app-shell {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .sidebar {
      width: 12.5rem;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar-brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 0.55rem;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .nav-item:hover:not(:disabled) {
      background: rgba(108, 140, 255, 0.08);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(108, 140, 255, 0.14);
      border-color: rgba(108, 140, 255, 0.35);
      color: var(--text);
    }

    .nav-item-icon {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .app-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .view[hidden] {
      display: none !important;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    main { padding: 1.5rem; max-width: 1200px; width: 100%; margin: 0 auto; }

    .filters {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 0;
    }

    .filters[hidden] { display: none; }

    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .filters-row input,
    .filters-row select,
    .source-config-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
    }

    .filters-row input { flex: 1; min-width: 160px; }
    .filters-row select { min-width: 130px; }

    #refresh {
      margin-left: auto;
      flex-shrink: 0;
    }

    .filters-row input:focus,
    .filters-row select:focus,
    .source-config-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .chip:hover,
    .chip.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(108, 140, 255, 0.1);
    }

    .filter-count {
      margin-top: 0.65rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .source-config-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .source-config-panel {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem 0;
    }

    .source-config-panel[hidden] {
      display: none;
    }

    .source-config-row label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .source-config-row input {
      min-width: 0;
    }

    .streams-panel {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 1.5rem;
      flex: 1;
    }

    .streams-panel-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      min-height: 12rem;
    }

    .streams-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .streams-header h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .streams-meta {
      font-size: 0.78rem;
      color: var(--muted);
      flex: 1;
      min-width: 12rem;
    }

    .streams-meta strong {
      color: var(--text);
      font-weight: 500;
    }

    .streams-add {
      margin-bottom: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .streams-add-title {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.55rem;
    }

    .streams-add-grid {
      display: grid;
      grid-template-columns: 1.1fr 2fr 1.2fr auto;
      gap: 0.5rem;
      align-items: end;
    }

    .streams-add-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .streams-add-field label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .streams-add-field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      width: 100%;
    }

    .streams-add-field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .streams-add-status {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.1em;
    }

    .streams-add-status.error {
      color: var(--danger);
    }

    .streams-add-status.ok {
      color: var(--success);
    }

    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .stream-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      color: inherit;
      width: 100%;
      padding: 0;
      font: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }

    .stream-card:hover:not(:disabled),
    .stream-card:focus-visible {
      border-color: var(--accent);
      background: var(--bg);
      transform: translateY(-2px);
    }

    .stream-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stream-card-poster {
      aspect-ratio: 2 / 3;
      background: #12151d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.75rem;
      position: relative;
    }

    .stream-card-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stream-card-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .stream-card:hover .stream-card-play,
    .stream-card:focus-visible .stream-card-play {
      opacity: 1;
    }

    .stream-card-play span {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 999px;
      background: rgba(108, 140, 255, 0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .stream-card-badge {
      position: absolute;
      top: 0.4rem;
      left: 0.4rem;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      z-index: 1;
    }

    .stream-card-badge.manual {
      left: auto;
      right: 0.4rem;
      background: rgba(74, 222, 128, 0.95);
      color: #0f1117;
    }

    .stream-card-remove {
      position: absolute;
      bottom: 0.4rem;
      right: 0.4rem;
      z-index: 2;
      background: rgba(15, 17, 23, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.2rem 0.45rem;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
    }

    .stream-card-remove:hover:not(:disabled) {
      background: rgba(255, 107, 107, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .stream-card-body {
      padding: 0.55rem 0.6rem 0.7rem;
    }

    .stream-card-title {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stream-card-year {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stream-card-qualities {
      margin-top: 0.45rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    .stream-quality-chip {
      font-size: 0.65rem;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      background: rgba(108, 140, 255, 0.12);
      color: var(--accent);
      border: 1px solid transparent;
    }

    .stream-player-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 60;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .stream-player-backdrop[hidden] {
      display: none;
    }

    .stream-player-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto 0.75rem;
    }

    .stream-player-bar h2 {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      min-width: 10rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stream-player-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .stream-player-controls label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stream-player-controls select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.4rem 0.55rem;
      font-size: 0.8rem;
      min-width: 6.5rem;
    }

    .stream-player-controls select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .stream-player-video-wrap {
      flex: 1;
      min-height: 0;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .stream-player-video-wrap video {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 5.5rem);
      background: #000;
    }

    .streams-empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.5rem 0;
    }

    .empty-actions {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .empty-hint {
      max-width: 520px;
      margin: 0.5rem auto 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .selector-debug {
      margin: 0.75rem 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.78rem;
      text-align: left;
    }

    .selector-debug code {
      display: block;
      margin-top: 0.35rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .genre-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .genre-tag {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      background: rgba(108, 140, 255, 0.12);
      color: var(--accent);
    }

    .state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .state.error { color: var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .poster {
      aspect-ratio: 2 / 3;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      padding: 0.5rem;
      position: relative;
    }

    .quality-badges {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      align-items: flex-end;
    }

    .quality-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .quality-badge.hd {
      background: rgba(74, 222, 128, 0.9);
      color: #0f1117;
    }

    .quality-badge.k4 {
      background: rgba(251, 191, 36, 0.95);
      color: #0f1117;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 0.85rem; }

    .card h2 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scraped-title {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .rating {
      color: #fbbf24;
      font-weight: 600;
    }

    .type-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }

    .type-badge.tv {
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.12);
    }

    .overview {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card a {
      color: var(--accent);
      font-size: 0.75rem;
      text-decoration: none;
      word-break: break-all;
    }

    .card a:hover { text-decoration: underline; }

    .empty { color: var(--muted); font-size: 0.9rem; }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    footer a { color: var(--accent); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-backdrop[hidden] { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: min(100%, 480px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }

    .modal p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .modal p code {
      color: var(--text);
      font-size: 0.8rem;
    }

    .modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .modal input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff8585;
    }

    .download-link {
      cursor: pointer;
    }
    .download-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      max-height: 360px;
      overflow-y: auto;
    }

    .download-option {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color 0.15s;
      text-align: left;
      cursor: pointer;
    }

    button.download-option {
      font-family: inherit;
    }

    .download-back {
      margin-bottom: 0.75rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }

    .download-option:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    .download-option span {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 0.25rem;
      word-break: break-all;
    }

    button.download-option:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .download-option.saved {
      border-color: var(--success);
    }

    .download-option.failed {
      border-color: var(--danger);
    }

    .download-save-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .episode-picker {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .episode-picker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .episode-picker label {
      min-width: 4.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .episode-picker select {
      flex: 1;
      min-width: 8rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
    }

    .episode-picker .btn-secondary {
      width: 100%;
    }

    .card-download-status {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-download-status .download-active-label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .download-progress {
      height: 6px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .download-progress.thin {
      height: 4px;
      margin-top: 0.25rem;

    .download-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      border: none;
      cursor: default;
      flex-shrink: 0;
    }

    .download-badge svg {
      width: 1rem;
      height: 1rem;
      display: block;
    }

    .download-badge.downloaded {
      position: absolute;
      bottom: 0.5rem;
      left: 0.5rem;
      background: rgba(74, 222, 128, 0.95);
      color: #0f1117;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);

    .download-badge.failed {
      background: rgba(255, 107, 107, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.4);
    }

    .download-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 12rem;
      max-width: 18rem;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.68rem;
      line-height: 1.35;
      word-break: break-all;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s, visibility 0.15s;
      z-index: 5;
    }

    .download-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--border);
    }

    .download-badge:hover .download-tooltip,
    .download-badge:focus .download-tooltip,
    .download-badge:focus-within .download-tooltip {
      opacity: 1;
      visibility: visible;

    .card-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
      padding: 0.5rem 0.75rem;

    .card-action-btn:hover {
      background: rgba(108, 140, 255, 0.16);

    }

    @media (max-width: 768px) {
      .app-shell {
        flex-direction: column;
        padding-bottom: calc(3.75rem + env(safe-area-inset-bottom, 0px));
      }

      .sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        width: 100%;
        height: auto;
        flex-direction: row;

        gap: 0.5rem;
        padding: 0.45rem 0.65rem calc(0.45rem + env(safe-area-inset-bottom, 0px));

      .sidebar-brand {

      .sidebar-nav {

      main,

      .filters-row input[type="search"] {

      .filter-chips {

  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-brand">Movie Server</div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-view="library" aria-current="page">
          <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v13A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5v-13Z" />
            <path d="M14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 18.5v-13Z" />

        <button type="button" class="nav-item" data-view="streams">
          <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z" />

          </svg>

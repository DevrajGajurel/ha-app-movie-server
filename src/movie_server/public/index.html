        </button>
      </nav>
    </aside>

    <div class="app-main">
      <div class="view" id="view-library">
        <section class="source-config-panel" id="source-config" hidden>
          <div class="source-config-row">
            <label for="main-url-input">Source URL</label>
            <input id="main-url-input" type="url" placeholder="https://filmyfly.luxe/" />
            <button id="apply-main-url" type="button">Apply</button>
          </div>
          <div class="source-config-row">
            <label for="secondary-url-input">Secondary URL (HD only)</label>
            <input id="secondary-url-input" type="url" placeholder="https://… (optional)" />
            <button id="apply-secondary-url" type="button">Apply</button>
          </div>
          <div class="source-config-row">
            <label for="cineby-url-input">Cineby URL</label>
            <input id="cineby-url-input" type="url" placeholder="https://…" />
            <button id="apply-cineby-url" type="button">Apply</button>
          </div>
        </section>

        <section class="filters" id="filters" hidden>
          <div class="filters-panel">
            <div class="filters-row">
              <input id="search-input" type="search" placeholder="Search titles…" />
              <select id="sort-select" aria-label="Sort by">
                <option value="source-order">Source order</option>
                <option value="release-desc">Newest first</option>
                <option value="release-asc">Oldest first</option>
                <option value="rating-desc">Top rated</option>
                <option value="title-asc">Title A–Z</option>
              </select>
              <select id="type-filter" aria-label="Filter by type">
                <option value="all">All types</option>
                <option value="movie">Movies</option>
                <option value="tv">TV Series</option>
              </select>
              <select id="genre-filter" aria-label="Filter by genre">
                <option value="all">All genres</option>
              </select>
              <select id="year-filter" aria-label="Filter by year">
                <option value="all">All years</option>
                <option value="recent">Recent (2 yrs)</option>
              </select>
              <select id="quality-filter" aria-label="Filter by quality">
                <option value="all">All quality</option>
                <option value="hd">HD</option>
                <option value="k4">4K</option>
              </select>
              <button id="refresh" type="button">Refresh</button>
            </div>
            <div class="filter-chips">
              <button class="chip" type="button" data-preset="recent">Recent releases</button>
              <button class="chip" type="button" data-preset="top-rated">Top rated (7+)</button>
              <button class="chip" type="button" data-preset="movies">Movies only</button>
              <button class="chip" type="button" data-preset="tv">TV only</button>
              <button class="chip" type="button" data-preset="hd">HD only</button>
              <button class="chip" type="button" data-preset="k4">4K only</button>
              <button class="chip" type="button" data-preset="reset">Reset filters</button>
            </div>
            <p class="filter-count" id="filter-count"></p>
          </div>
        </section>

        <main>
          <div id="content" class="state"></div>
        </main>

        <footer id="footer" hidden>
          Metadata from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>
        </footer>
      </div>

      <div class="view" id="view-streams" hidden>
        <section class="streams-panel" id="streams-panel">
          <div class="streams-panel-inner">
            <div class="streams-header">
              <h2>Streams</h2>
              <p class="streams-meta" id="streams-meta">Loading catalog…</p>
              <button id="streams-refresh" type="button">Refresh catalog</button>
            </div>
            <div class="streams-add" id="streams-add">
              <div class="streams-add-title">Add m3u8 to cache</div>
              <div class="streams-add-grid">
                <div class="streams-add-field">
                  <label for="manual-stream-title">Title</label>
                  <input id="manual-stream-title" type="text" placeholder="Movie title" autocomplete="off" />
                </div>
                <div class="streams-add-field">
                  <label for="manual-stream-url">m3u8 URL</label>
                  <input id="manual-stream-url" type="url" placeholder="https://…/master.m3u8" autocomplete="off" />
                </div>
                <div class="streams-add-field">
                  <label for="manual-stream-referer">Referer (optional)</label>
                  <input id="manual-stream-referer" type="url" placeholder="https://…" autocomplete="off" />
                </div>
                <button id="manual-stream-add" type="button">Add</button>
              </div>
              <p class="streams-add-status" id="manual-stream-status"></p>
            </div>
            <div id="streams-content" class="streams-empty">Loading…</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="download-modal" hidden>
    <div class="modal" role="dialog" aria-labelledby="download-modal-title">
      <h2 id="download-modal-title">Download options</h2>
      <div id="download-modal-content" class="download-state">Loading…</div>
      <div class="modal-actions">
        <button class="btn-secondary" id="download-modal-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="stream-player-backdrop" id="stream-player" hidden>
    <div class="stream-player-bar">
      <h2 id="stream-player-title">Playing</h2>
      <div class="stream-player-controls">
        <label>
          Quality
          <select id="stream-player-quality" aria-label="Video quality"></select>
        </label>
        <label>
          Audio
          <select id="stream-player-audio" aria-label="Audio track"></select>
        </label>
        <button class="btn-secondary" id="stream-player-close" type="button">Close</button>
      </div>
    </div>
    <div class="stream-player-video-wrap">
      <video id="stream-player-video" controls playsinline></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    const content = document.getElementById("content");
    const refreshBtn = document.getElementById("refresh");
    const footer = document.getElementById("footer");
    const filtersEl = document.getElementById("filters");
    const sourceConfigEl = document.getElementById("source-config");
    const mainUrlInput = document.getElementById("main-url-input");
    const applyMainUrlBtn = document.getElementById("apply-main-url");
    const secondaryUrlInput = document.getElementById("secondary-url-input");
    const applySecondaryUrlBtn = document.getElementById("apply-secondary-url");
    const cinebyUrlInput = document.getElementById("cineby-url-input");
    const applyCinebyUrlBtn = document.getElementById("apply-cineby-url");
    const streamsMetaEl = document.getElementById("streams-meta");
    const streamsContentEl = document.getElementById("streams-content");
    const streamsRefreshBtn = document.getElementById("streams-refresh");
    const manualStreamTitle = document.getElementById("manual-stream-title");
    const manualStreamUrl = document.getElementById("manual-stream-url");
    const manualStreamReferer = document.getElementById("manual-stream-referer");
    const manualStreamAddBtn = document.getElementById("manual-stream-add");
    const manualStreamStatus = document.getElementById("manual-stream-status");
    const streamPlayerEl = document.getElementById("stream-player");
    const streamPlayerTitle = document.getElementById("stream-player-title");
    const streamPlayerVideo = document.getElementById("stream-player-video");
    const streamPlayerClose = document.getElementById("stream-player-close");
    const streamPlayerQuality = document.getElementById("stream-player-quality");
    const streamPlayerAudio = document.getElementById("stream-player-audio");
    const viewLibraryEl = document.getElementById("view-library");
    const viewStreamsEl = document.getElementById("view-streams");
    const navItems = document.querySelectorAll(".nav-item[data-view]");
    let streamsPollTimer = null;
    let activeView = "library";
    let streamsCatalogMovies = [];
    let streamHls = null;
    let streamFallbackQualities = [];
    let allMovies = [];
    let nextSourceOrder = 0;
    let tmdbEnabledFlag = false;
    let loadGeneration = 0;
    const activePresets = new Set();
    let loadedThroughPage = 0;
    let totalMaxPages = 1;
    let initialPagesCount = 2;
    let sourceSearchTimer = null;
    let sourceSearchGeneration = 0;
    let sourceSearchQuery = "";
    let sourceSearchMovies = [];
    let sourceSearchLoading = false;
    let sourceSearchError = "";

    const searchInput = document.getElementById("search-input");
    const sortSelect = document.getElementById("sort-select");
    const typeFilter = document.getElementById("type-filter");
    const genreFilter = document.getElementById("genre-filter");
    const yearFilter = document.getElementById("year-filter");
    const qualityFilter = document.getElementById("quality-filter");
    const filterCountEl = document.getElementById("filter-count");
    const downloadModal = document.getElementById("download-modal");
    const downloadModalTitle = document.getElementById("download-modal-title");
    const downloadModalContent = document.getElementById("download-modal-content");
    let downloadModalState = { title: "", options: [], movieTitle: "", tmdbId: null };
    const jobPollers = new Map();
    let downloadJobs = [];
    let downloadJobsPoller = null;
    let downloadedTmdbIds = new Set();
    let downloadedTitles = new Set();

    function apiUrl(path) {
      const base = window.MOVIE_SERVER_API_BASE || "";
      return `${base}api/${path.replace(/^\//, "")}`;
    }

    function normalizeTitle(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/\(tmdb-\d+\)/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    async function refreshDownloadLibrary() {
      try {
        const res = await fetch(apiUrl("downloads/library"));
        const data = await res.json();
        if (!res.ok) return;
        downloadedTmdbIds = new Set((data.tmdbIds || []).map(String));
        downloadedTitles = new Set(data.titles || []);
      } catch {
        // Ignore transient failures; downloads still work.
      }
    }

    function isAlreadyDownloaded(movie) {
      const t = movie?.tmdb;
      if (t?.tmdbId && downloadedTmdbIds.has(String(t.tmdbId))) return true;
      const title = t?.tmdbTitle || movie?.title || "";
      const norm = normalizeTitle(title);
      return norm ? downloadedTitles.has(norm) : false;
    }

    async function fetchPageRange(from, to, { refresh = false } = {}) {
      const params = new URLSearchParams({ from: String(from), to: String(to) });
      if (refresh) params.set("refresh", "1");
      const res = await fetch(apiUrl(`movies?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function mergeMovies(incoming) {
      const seen = new Set(allMovies.map((movie) => movie.link));
      for (const movie of incoming) {
        if (!seen.has(movie.link)) {
          seen.add(movie.link);
          allMovies.push({ ...movie, sourceOrder: nextSourceOrder++ });
        }
      }
    }

    async function loadRemainingPages(gen, fromPage, toPage, { refresh = false } = {}) {
      for (let page = fromPage; page <= toPage; page++) {
        if (gen !== loadGeneration) return;

        try {
          const data = await fetchPageRange(page, page, { refresh });
          if (gen !== loadGeneration) return;

          mergeMovies(data.movies || []);
          loadedThroughPage = page;
          tmdbEnabledFlag = data.tmdbEnabled;
          filtersEl.hidden = allMovies.length === 0;
          populateFilterOptions(allMovies);
          applyFiltersAndRender();
        } catch (err) {
          console.error(err);
        }
      }
    }

    function getDisplayTitle(movie) {
      return movie.tmdb?.tmdbTitle || movie.title || "Untitled";
    }

    function getReleaseTime(movie) {
      if (movie.tmdb?.releaseDate) return new Date(movie.tmdb.releaseDate).getTime();
      if (movie.tmdb?.year) return new Date(`${movie.tmdb.year}-01-01`).getTime();
      return 0;
    }

    function populateFilterOptions(movies) {
      const genres = new Set();
      const years = new Set();

      for (const movie of movies) {
        for (const genre of movie.tmdb?.genres || []) genres.add(genre);
        if (movie.tmdb?.year) years.add(movie.tmdb.year);
      }

      const currentGenre = genreFilter.value;
      genreFilter.innerHTML = '<option value="all">All genres</option>';
      [...genres].sort().forEach((genre) => {
        const opt = document.createElement("option");
        opt.value = genre;
        opt.textContent = genre;
        genreFilter.appendChild(opt);
      });
      if ([...genreFilter.options].some((o) => o.value === currentGenre)) {
        genreFilter.value = currentGenre;
      }

      const currentYear = yearFilter.value;
      yearFilter.innerHTML = `
        <option value="all">All years</option>
        <option value="recent">Recent (2 yrs)</option>
      `;
      [...years].sort((a, b) => b - a).forEach((year) => {
        const opt = document.createElement("option");
        opt.value = year;
        opt.textContent = year;
        yearFilter.appendChild(opt);
      });
      if ([...yearFilter.options].some((o) => o.value === currentYear)) {
        yearFilter.value = currentYear;
      }
    }

    async function fetchSourceSearch(query) {
      const params = new URLSearchParams({ q: query });
      const res = await fetch(apiUrl(`movies/search?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function scheduleSourceSearch(query) {
      const q = query.trim();
      if (sourceSearchTimer) clearTimeout(sourceSearchTimer);

      if (!q) {
        sourceSearchQuery = "";
        sourceSearchMovies = [];
        sourceSearchLoading = false;
        sourceSearchError = "";
        return;
      }

      // Already fetched this exact query (even if it returned zero hits).
      if (sourceSearchQuery === q) return;

      sourceSearchLoading = true;
      sourceSearchError = "";
      sourceSearchTimer = setTimeout(async () => {
        const gen = ++sourceSearchGeneration;
        try {
          const data = await fetchSourceSearch(q);
          if (gen !== sourceSearchGeneration) return;
          sourceSearchQuery = q;
          sourceSearchMovies = data.movies || [];
          sourceSearchLoading = false;
          sourceSearchError = "";
          mergeMovies(sourceSearchMovies);
          populateFilterOptions(allMovies);
          applyFiltersAndRender({ skipSourceSearch: true });
        } catch (err) {
          if (gen !== sourceSearchGeneration) return;
          sourceSearchQuery = q;
          sourceSearchMovies = [];
          sourceSearchLoading = false;
          sourceSearchError = err.message || "Source search failed";
          applyFiltersAndRender({ skipSourceSearch: true });
        }
      }, 450);
    }

    function applyFiltersAndRender({ skipSourceSearch = false } = {}) {
      let list = [...allMovies];
      const search = searchInput.value.trim().toLowerCase();
      const type = typeFilter.value;
      const genre = genreFilter.value;
      const year = yearFilter.value;
      const quality = qualityFilter.value;
      const sort = sortSelect.value;

      if (search) {
        list = list.filter((m) => getDisplayTitle(m).toLowerCase().includes(search));
      }

      if (type !== "all") {
        list = list.filter((m) => m.tmdb?.type === type);
      }

      if (genre !== "all") {
        list = list.filter((m) => m.tmdb?.genres?.includes(genre));
      }

      if (year === "recent") {
        const cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - 2);
        list = list.filter((m) => {
          const time = getReleaseTime(m);
          return time && time >= cutoff.getTime();
        });
      } else if (year !== "all") {
        list = list.filter((m) => m.tmdb?.year === year);
      }

      if (quality === "hd") {
        list = list.filter((m) => m.quality?.hd);
      } else if (quality === "k4") {
        list = list.filter((m) => m.quality?.k4);
      }

      if (activePresets.has("recent")) {
        const cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - 2);
        list = list.filter((m) => {
          const time = getReleaseTime(m);
          return time && time >= cutoff.getTime();
        });
      }

      if (activePresets.has("top-rated")) {
        list = list.filter((m) => (m.tmdb?.rating || 0) >= 7);
      }

      if (activePresets.has("movies")) {
        list = list.filter((m) => m.tmdb?.type === "movie");
      }

      if (activePresets.has("tv")) {
        list = list.filter((m) => m.tmdb?.type === "tv");
      }

      if (activePresets.has("hd")) {
        list = list.filter((m) => m.quality?.hd);
      }

      if (activePresets.has("k4")) {
        list = list.filter((m) => m.quality?.k4);
      }

      list.sort((a, b) => {
        if (sort === "source-order") return (a.sourceOrder ?? 0) - (b.sourceOrder ?? 0);
        if (sort === "release-desc") return getReleaseTime(b) - getReleaseTime(a);
        if (sort === "release-asc") return getReleaseTime(a) - getReleaseTime(b);
        if (sort === "rating-desc") return (b.tmdb?.rating || 0) - (a.tmdb?.rating || 0);
        return getDisplayTitle(a).localeCompare(getDisplayTitle(b));
      });

      const localSearchHits = search
        ? allMovies.filter((m) => getDisplayTitle(m).toLowerCase().includes(search)).length
        : allMovies.length;

      if (!skipSourceSearch && search && localSearchHits === 0) {
        scheduleSourceSearch(searchInput.value.trim());
      } else if (!search) {
        scheduleSourceSearch("");
      }

      filterCountEl.textContent = `Showing ${list.length} of ${allMovies.length}`;
      if (list.length === 0 && search) {
        if (sourceSearchLoading || (sourceSearchTimer && localSearchHits === 0)) {
          filterCountEl.textContent = `Searching source site for "${searchInput.value.trim()}"…`;
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              No local matches for <strong>${escapeHtml(searchInput.value.trim())}</strong>.
              Searching <code>search.html</code> on the source site…
            </p>`;
        } else if (sourceSearchError && sourceSearchQuery === searchInput.value.trim()) {
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              Source search failed for <strong>${escapeHtml(searchInput.value.trim())}</strong>:
              ${escapeHtml(sourceSearchError)}
            </p>`;
        } else if (loadedThroughPage < totalMaxPages && localSearchHits === 0 && !sourceSearchQuery) {
          filterCountEl.textContent = `No matches yet in ${allMovies.length} loaded · pages ${loadedThroughPage + 1}-${totalMaxPages} loading…`;
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              No results for <strong>${escapeHtml(searchInput.value.trim())}</strong> in loaded pages so far.
              Still fetching pages ${loadedThroughPage + 1}-${totalMaxPages} in the background…
            </p>`;
        } else {
          renderEmptySearch(searchInput.value.trim());
        }
      } else {
        renderMovies(list, tmdbEnabledFlag);
        if (search && sourceSearchQuery === searchInput.value.trim() && sourceSearchMovies.length) {
          filterCountEl.textContent = `Showing ${list.length} of ${allMovies.length} (includes source search)`;
        }
      }

      syncChipActiveStates();
    }

    function syncChipActiveStates() {
      document.querySelectorAll(".chip[data-preset]").forEach((chip) => {
        const preset = chip.dataset.preset;
        if (preset === "reset") return;
        const active = activePresets.has(preset);
        chip.classList.toggle("active", active);
        chip.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function resetFilters() {
      searchInput.value = "";
      sortSelect.value = "source-order";
      typeFilter.value = "all";
      genreFilter.value = "all";
      yearFilter.value = "all";
      qualityFilter.value = "all";
      activePresets.clear();
      syncChipActiveStates();
      applyFiltersAndRender();
    }

    function togglePreset(preset) {
      if (preset === "reset") {
        resetFilters();
        return;
      }

      if (activePresets.has(preset)) {
        activePresets.delete(preset);
      } else {
        if (preset === "movies") activePresets.delete("tv");
        if (preset === "tv") activePresets.delete("movies");
        activePresets.add(preset);
        if (preset === "recent") sortSelect.value = "release-desc";
        if (preset === "top-rated") sortSelect.value = "rating-desc";
      }

      syncChipActiveStates();
      applyFiltersAndRender();
    }
    function renderEmptySearch(searchTerm) {
      const canLoadMore = loadedThroughPage < totalMaxPages;
      const pagesHint = canLoadMore
        ? "Load more pages to search a wider listing."
        : "Increase max_pages in the Home Assistant add-on configuration to fetch more listings.";

      content.className = "state empty";
      content.innerHTML = `
        <div>No results found for <strong>${escapeHtml(searchTerm)}</strong>.</div>
        <p class="empty-hint">
          Searched ${loadedThroughPage} loaded page${loadedThroughPage === 1 ? "" : "s"}.
          ${pagesHint}
        </p>
        <div class="empty-actions">
          <button id="search-deeper" type="button" ${canLoadMore ? "" : "disabled"}>
            Load more pages
          </button>
          <button class="btn-secondary" id="clear-search" type="button">Clear search</button>
        </div>
      `;

      document.getElementById("search-deeper")?.addEventListener("click", async () => {
        const btn = document.getElementById("search-deeper");
        btn.disabled = true;
        btn.textContent = "Loading…";
        const gen = loadGeneration;
        const from = loadedThroughPage + 1;
        const to = Math.min(loadedThroughPage + 3, totalMaxPages);
        await loadRemainingPages(gen, from, to);
        applyFiltersAndRender();
      });

      document.getElementById("clear-search")?.addEventListener("click", () => {
        searchInput.value = "";
        applyFiltersAndRender();
      });
    }

    function renderMovies(movies, tmdbEnabled) {
      footer.hidden = !tmdbEnabled;

      if (!movies.length) {
        content.className = "state empty";
        content.textContent = "No movies found. Check the add-on source URL configuration.";
        return;
      }

      content.className = "grid";
      content.innerHTML = movies.map((m) => {
        const t = m.tmdb;
        const displayTitle = t?.tmdbTitle || m.title || "Untitled";
        const poster = t?.poster
          ? `<img src="${escapeAttr(t.poster)}" alt="${escapeAttr(displayTitle)}" loading="lazy" />`
          : "No poster";

        const qualityBadges = `
          <div class="quality-badges">
            ${m.quality?.k4 ? '<span class="quality-badge k4">4K</span>' : ""}
            ${m.quality?.hd ? '<span class="quality-badge hd">HD</span>' : ""}
          </div>`;

        return `
        <article class="card">
          <div class="poster">${poster}${qualityBadges}${renderDownloadedBadge(m, displayTitle)}</div>
          <div class="card-body">
            <h2>${escapeHtml(displayTitle)}</h2>
            ${m.title && m.title !== displayTitle ? `<div class="scraped-title">${escapeHtml(m.title)}</div>` : ""}
            ${t ? `
              <div class="meta-row">
                <span class="type-badge${t.type === "tv" ? " tv" : ""}">${t.type === "tv" ? "TV Series" : "Movie"}</span>
                ${t.year ? `<span>${escapeHtml(t.year)}</span>` : ""}
                ${t.rating ? `<span class="rating">★ ${t.rating}</span>` : ""}
              </div>
              ${t.genres?.length ? `<div class="genre-tags">${t.genres.slice(0, 3).map((g) => `<span class="genre-tag">${escapeHtml(g)}</span>`).join("")}</div>` : ""}
              ${t.overview ? `<p class="overview">${escapeHtml(t.overview)}</p>` : ""}
            ` : (tmdbEnabled ? `<p class="overview">No TMDB match</p>` : "")}
            <div class="links">
              <a href="#" class="download-link card-action-btn" data-download-link="${escapeAttr(m.link)}" data-download-title="${escapeAttr(displayTitle)}" data-tmdb-id="${escapeAttr(t?.tmdbId ? String(t.tmdbId) : "")}" data-source="${escapeAttr(m.source || "")}" data-media-type="${escapeAttr(t?.type || (m.seasons ? "tv" : "movie"))}" data-seasons="${escapeAttr(JSON.stringify(t?.seasons || []))}" data-season-hint="${escapeAttr(m.seasons || "")}">Download</a>
              ${t?.tmdbUrl ? `<a class="card-action-btn" href="${escapeAttr(t.tmdbUrl)}" target="_blank" rel="noopener noreferrer">TMDB</a>` : ""}
            </div>
            ${renderCardDownloadStatus(displayTitle)}
          </div>
        </article>`;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function closeDownloadModal() {
      downloadModal.hidden = true;
      downloadModalState = { title: "", options: [], movieTitle: "", tmdbId: null };
      for (const timer of jobPollers.values()) clearInterval(timer);
      jobPollers.clear();
    }

    function formatJobStatus(job) {
      if (job.status === "queued") return "Queued…";
      if (job.status === "downloading") {
        if (job.totalBytes > 0) {
          const pct = Math.min(100, Math.round((job.receivedBytes / job.totalBytes) * 100));
          return `Downloading… ${pct}%`;
        }
        return "Downloading…";
      }
      if (job.status === "completed") return "Saved";
      if (job.status === "failed") return `Failed: ${job.error}`;
      return job.status;
    }

    function jobProgress(job) {
      if (!job.totalBytes) return 0;
      return Math.min(100, Math.round((job.receivedBytes / job.totalBytes) * 100));
    }

    function latestJobForMovie(title) {
      if (!title) return null;
      return downloadJobs.find((job) => job.movieTitle === title) || null;
    }

    function renderDownloadedBadge(movie, title) {
      const job = latestJobForMovie(title);
      const jobDone = job && job.status === "completed";
      const libraryDone = isAlreadyDownloaded(movie);
      if (!jobDone && !libraryDone) return "";

      const tip = (jobDone && job.filePath) || "Already downloaded";
      return `
        <span class="download-badge downloaded" tabindex="0" aria-label="Downloaded" title="${escapeAttr(tip)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <span class="download-tooltip">${escapeHtml(tip)}</span>
        </span>
      `;
    }

    function renderCardDownloadStatus(title) {
      const job = latestJobForMovie(title);
      if (!job || job.status === "completed") return "";

      const progress = jobProgress(job);

      if (job.status === "failed") {
        const tip = job.error || "Download failed";
        return `
          <div class="card-download-status">
            <span class="download-badge failed" tabindex="0" aria-label="Download failed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
                <circle cx="12" cy="12" r="9"/>
              </svg>
              <span class="download-tooltip">${escapeHtml(tip)}</span>
            </span>
          </div>
        `;
      }

      return `
        <div class="card-download-status">
          <span class="download-active-label">${escapeHtml(formatJobStatus(job))}</span>
          <div class="download-progress thin" style="--progress: ${progress}%"><span></span></div>
        </div>
      `;
    }

    async function refreshDownloadJobs({ rerender = true } = {}) {
      try {
        const res = await fetch(apiUrl("downloads/jobs"));
        const data = await res.json();
        if (!res.ok) return;
        downloadJobs = data.jobs || [];
        if (rerender) applyFiltersAndRender();
        updateDownloadJobsPoller();
      } catch {
        // Ignore transient polling failures.
      }
    }

    function updateDownloadJobsPoller() {
      const hasActiveJobs = downloadJobs.some((job) => job.status === "queued" || job.status === "downloading");
      if (hasActiveJobs && !downloadJobsPoller) {
        downloadJobsPoller = setInterval(() => refreshDownloadJobs(), 2000);
      } else if (!hasActiveJobs && downloadJobsPoller) {
        clearInterval(downloadJobsPoller);
        downloadJobsPoller = null;
      }
    }

    function startJobPolling(jobId, button, label, onComplete) {
      if (jobPollers.has(jobId)) clearInterval(jobPollers.get(jobId));

      const timer = setInterval(async () => {
        try {
          const res = await fetch(apiUrl("downloads/jobs"));
          const data = await res.json();
          const job = data.jobs?.find((item) => item.id === jobId);
          if (!job) return;

          button.textContent = `${label} — ${formatJobStatus(job)}`;

          if (job.status === "completed") {
            button.classList.add("saved");
            button.disabled = true;
            clearInterval(timer);
            jobPollers.delete(jobId);
            if (typeof onComplete === "function") onComplete();
          } else if (job.status === "failed") {
            button.classList.add("failed");
            button.disabled = false;
            clearInterval(timer);
            jobPollers.delete(jobId);
          } else {
            button.disabled = true;
          }
        } catch {
          // keep polling
        }
      }, 1500);

      jobPollers.set(jobId, timer);
    }

    async function startServerDownload(button) {
      const { url, label, movieTitle, tmdbId } = button.dataset;
      button.disabled = true;
      button.textContent = `${label} — Starting…`;

      const res = await fetch(apiUrl("downloads/save"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, label, movieTitle, tmdbId: tmdbId || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      button.textContent = `${label} — Queued…`;
      await refreshDownloadJobs();
      startJobPolling(data.job.id, button, label, () => {
        refreshDownloadLibrary().then(() => applyFiltersAndRender());
      });
    }

    function renderQualityOptions(options) {
      return `
        <ul class="download-list">
          ${options.map((option) => `
            <li>
              <button type="button" class="download-option download-picker" data-url="${escapeAttr(option.href)}" data-label="${escapeAttr(option.label)}">
                ${escapeHtml(option.label)}
                <span>${escapeHtml(option.href)}</span>
              </button>
            </li>
          `).join("")}
        </ul>
      `;
    }

    function renderSelectorDebug(selectors) {
      if (!selectors?.length) return "";

      return `
        <div class="selector-debug">
          <div>Selectors tried:</div>
          ${selectors.map((item) => `
            <code>${escapeHtml(item.selector)} → ${Number(item.matches || 0)} match${Number(item.matches || 0) === 1 ? "" : "es"}</code>
          `).join("")}
        </div>
      `;
    }

    function renderDirectOptions(options, parentLabel, movieTitle, tmdbId, { showBack = true } = {}) {
      return `
        ${showBack ? `<button type="button" class="btn-secondary download-back">← Back</button>` : ""}
        ${parentLabel ? `<p class="empty-hint">${escapeHtml(parentLabel)}</p>` : ""}
        <p class="download-save-hint">Click to download to PlexMedia on the server (background download).</p>
        <ul class="download-list">
          ${options.map((option) => `
            <li>
              <button
                type="button"
                class="download-option server-download"
                data-url="${escapeAttr(option.href)}"
                data-label="${escapeAttr(option.label)}"
                data-movie-title="${escapeAttr(movieTitle || "")}"
                data-tmdb-id="${escapeAttr(tmdbId ? String(tmdbId) : "")}"
              >
                ${escapeHtml(option.label)}
              </button>
            </li>
          `).join("")}
        </ul>
      `;
    }

    async function loadDirectDownloads(pageUrl, parentLabel) {
      downloadModalContent.className = "download-state";
      downloadModalContent.textContent = "Loading direct download links…";

      const res = await fetch(apiUrl(`downloads?url=${encodeURIComponent(pageUrl)}&type=direct`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      if (!data.options?.length) {
        downloadModalContent.className = "download-state";
        downloadModalContent.innerHTML = `
          <button type="button" class="btn-secondary download-back">← Back</button>
          <p>No direct download links found.</p>
          ${renderSelectorDebug(data.selectors)}
          <a class="download-option" href="${escapeAttr(pageUrl)}" target="_blank" rel="noopener noreferrer">Open source page</a>
        `;
        return;
      }

      downloadModalContent.innerHTML = renderDirectOptions(
        data.options,
        parentLabel,
        downloadModalState.movieTitle,
        downloadModalState.tmdbId
      );
    }

    function parseSeasonHint(seasonsText) {
      const text = String(seasonsText || "");
      const range = text.match(/S(\d{1,2})\s*-\s*S(\d{1,2})/i);
      if (range) {
        return { from: Number.parseInt(range[1], 10), to: Number.parseInt(range[2], 10) };
      }
      const single = text.match(/S(\d{1,2})/i);
      if (single) {
        const n = Number.parseInt(single[1], 10);
        return { from: n, to: n };
      }
      return null;
    }

    function buildSeasonOptions(seasonsJson, seasonHint) {
      let seasons = [];
      try {
        seasons = JSON.parse(seasonsJson || "[]");
      } catch {
        seasons = [];
      }
      if (Array.isArray(seasons) && seasons.length) {
        return seasons
          .filter((s) => Number(s.seasonNumber) > 0)
          .map((s) => ({
            seasonNumber: Number(s.seasonNumber),
            episodeCount: Number(s.episodeCount) || 24,
            name: s.name || `Season ${s.seasonNumber}`,
          }));
      }

      const hint = parseSeasonHint(seasonHint);
      const from = hint?.from || 1;
      const to = hint?.to || 1;
      const options = [];
      for (let n = from; n <= to; n++) {
        options.push({ seasonNumber: n, episodeCount: 24, name: `Season ${n}` });
      }
      return options.length ? options : [{ seasonNumber: 1, episodeCount: 24, name: "Season 1" }];
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function renderEpisodePicker(seasons, selectedSeason, selectedEpisode) {
      const seasonMeta = seasons.find((s) => s.seasonNumber === selectedSeason) || seasons[0];
      const episodeCount = Math.max(1, Number(seasonMeta?.episodeCount) || 24);
      const seasonOptions = seasons
        .map(
          (s) =>
            `<option value="${s.seasonNumber}"${s.seasonNumber === selectedSeason ? " selected" : ""}>${escapeHtml(
              s.name || `Season ${s.seasonNumber}`
            )}</option>`
        )
        .join("");
      const episodeOptions = Array.from({ length: episodeCount }, (_, i) => i + 1)
        .map(
          (ep) =>
            `<option value="${ep}"${ep === selectedEpisode ? " selected" : ""}>Episode ${ep}</option>`
        )
        .join("");

      return `
        <div class="episode-picker">
          <p class="download-save-hint">Choose a season and episode, then load download links.</p>
          <div class="episode-picker-row">
            <label for="shegu-season">Season</label>
            <select id="shegu-season">${seasonOptions}</select>
          </div>
          <div class="episode-picker-row">
            <label for="shegu-episode">Episode</label>
            <select id="shegu-episode">${episodeOptions}</select>
          </div>
          <button type="button" class="btn-secondary" id="shegu-load-episode">Load downloads</button>
        </div>
        <div id="shegu-episode-results"></div>
      `;
    }

    async function loadSecondaryEpisodeDownloads() {
      const season = Number.parseInt(document.getElementById("shegu-season")?.value, 10);
      const episode = Number.parseInt(document.getElementById("shegu-episode")?.value, 10);
      const resultsEl = document.getElementById("shegu-episode-results");
      if (!resultsEl || !downloadModalState.tmdbId) return;

      resultsEl.innerHTML = `<p class="download-state">Loading S${pad2(season)}E${pad2(episode)}…</p>`;

      const params = new URLSearchParams({
        source: "secondary",
        tmdbId: String(downloadModalState.tmdbId),
        mediaType: "tv",
        season: String(season),
        episode: String(episode),
      });
      const res = await fetch(apiUrl(`downloads?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      const episodeTitle = `${downloadModalState.baseTitle || downloadModalState.movieTitle} S${pad2(season)}E${pad2(episode)}`;
      downloadModalState.movieTitle = episodeTitle;
      downloadModalState.season = season;
      downloadModalState.episode = episode;

      if (!data.options?.length) {
        resultsEl.innerHTML = `
          <p>No download links found for S${pad2(season)}E${pad2(episode)}.</p>
          ${renderSelectorDebug(data.selectors)}
        `;
        return;
      }

      resultsEl.innerHTML = renderDirectOptions(
        data.options,
        `S${pad2(season)}E${pad2(episode)}`,
        episodeTitle,
        downloadModalState.tmdbId,
        { showBack: false }
      );
    }

    function wireEpisodePicker(seasons) {
      const seasonSelect = document.getElementById("shegu-season");
      const episodeSelect = document.getElementById("shegu-episode");
      const loadBtn = document.getElementById("shegu-load-episode");

      seasonSelect?.addEventListener("change", () => {
        const selected = Number.parseInt(seasonSelect.value, 10);
        const meta = seasons.find((s) => s.seasonNumber === selected) || seasons[0];
        const count = Math.max(1, Number(meta?.episodeCount) || 24);
        episodeSelect.innerHTML = Array.from({ length: count }, (_, i) => i + 1)
          .map((ep) => `<option value="${ep}">Episode ${ep}</option>`)
          .join("");
      });

      loadBtn?.addEventListener("click", async () => {
        try {
          await loadSecondaryEpisodeDownloads();
        } catch (err) {
          const resultsEl = document.getElementById("shegu-episode-results");
          if (resultsEl) resultsEl.textContent = err.message;
        }
      });
    }

    async function openDownloadModal(pageUrl, title, tmdbId, source, mediaType, seasonsJson, seasonHint) {
      downloadModalTitle.textContent = title || "Download options";
      downloadModalContent.className = "download-state";
      downloadModalContent.textContent = "Loading download options…";
      downloadModal.hidden = false;

      try {
        const isSecondary = String(source || "").toLowerCase() === "secondary";
        if (isSecondary) {
          if (!tmdbId) {
            downloadModalContent.className = "download-state";
            downloadModalContent.textContent = "No TMDB match — cannot load secondary downloads.";
            return;
          }

          const isTv = String(mediaType || "").toLowerCase() === "tv" || Boolean(seasonHint);
          downloadModalState = {
            title: title || "Download options",
            options: [],
            movieTitle: title || "",
            baseTitle: title || "",
            tmdbId: tmdbId || null,
            source: "secondary",
            mediaType: isTv ? "tv" : "movie",
          };

          if (isTv) {
            const seasons = buildSeasonOptions(seasonsJson, seasonHint);
            const firstSeason = seasons[0]?.seasonNumber || 1;
            downloadModalContent.innerHTML = renderEpisodePicker(seasons, firstSeason, 1);
            wireEpisodePicker(seasons);
            return;
          }

          const res = await fetch(
            apiUrl(`downloads?source=secondary&tmdbId=${encodeURIComponent(tmdbId)}&mediaType=movie`)
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);

          downloadModalState.options = data.options || [];

          if (!data.options?.length) {
            downloadModalContent.className = "download-state";
            downloadModalContent.innerHTML = `
              <p>No download links found for this title.</p>
              ${renderSelectorDebug(data.selectors)}
            `;
            return;
          }

          downloadModalContent.innerHTML = renderDirectOptions(
            data.options,
            null,
            downloadModalState.movieTitle,
            downloadModalState.tmdbId,
            { showBack: false }
          );
          return;
        }

        const res = await fetch(apiUrl(`downloads?url=${encodeURIComponent(pageUrl)}`));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        if (!data.options?.length) {
          downloadModalContent.className = "download-state";
          downloadModalContent.innerHTML = `
            <p>No download links found on this page.</p>
            ${renderSelectorDebug(data.selectors)}
            <a class="download-option" href="${escapeAttr(pageUrl)}" target="_blank" rel="noopener noreferrer">Open source page</a>
          `;
          return;
        }

        downloadModalState = {
          title: title || "Download options",
          options: data.options,
          movieTitle: title || "",
          tmdbId: tmdbId || null,
          source: "",
        };
        downloadModalContent.innerHTML = renderQualityOptions(data.options);
      } catch (err) {
        downloadModalContent.className = "download-state";
        downloadModalContent.textContent = err.message;
      }
    }

    function setupSourceConfig(config) {
      if (!config?.configEditable) {
        sourceConfigEl.hidden = true;
        return;
      }

      sourceConfigEl.hidden = false;
      mainUrlInput.value = config.mainUrl || "";
      secondaryUrlInput.value = config.secondaryUrl || "";
      cinebyUrlInput.value = config.cinebyUrl || "";
    }

    function setView(view, { updateHash = true } = {}) {
      const next = view === "streams" ? "streams" : "library";
      activeView = next;
      viewLibraryEl.hidden = next !== "library";
      viewStreamsEl.hidden = next !== "streams";
      navItems.forEach((item) => {
        const on = item.dataset.view === next;
        item.classList.toggle("active", on);
        if (on) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });
      if (updateHash) {
        const hash = next === "streams" ? "#streams" : "#library";
        if (location.hash !== hash) {
          history.replaceState(null, "", hash);
        }
      }
      if (next === "streams") {
        loadStreamsCatalog().catch(() => {});
      }
    }

    function viewFromHash() {
      const hash = (location.hash || "").replace(/^#/, "").toLowerCase();
      return hash === "streams" ? "streams" : "library";
    }

    function formatStreamsTime(iso) {
      if (!iso) return "never";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString();
    }

    function streamQualityLabels(movie) {
      return streamQualities(movie).map((q) => q.label).filter(Boolean);
    }

    function streamQualities(movie) {
      const out = [];
      const seen = new Set();
      for (const stream of movie.streams || []) {
        const referer = stream.referer || movie.referer || "";
        for (const q of stream.qualities || []) {
          if (!q?.url) continue;
          const key = `${q.label || ""}|${q.url}`;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({
            label: q.label || stream.bestQuality || "Auto",
            url: q.url,
            referer,
            height: q.height != null ? Number(q.height) : null,
            bandwidth: q.bandwidth != null ? Number(q.bandwidth) : null,
          });
        }
        if (!(stream.qualities || []).length && stream.url) {
          const key = `auto|${stream.url}`;
          if (!seen.has(key)) {
            seen.add(key);
            out.push({
              label: stream.bestQuality || "Auto",
              url: stream.url,
              referer,
              height: null,
              bandwidth: null,
            });
          }
        }
      }
      return out.sort((a, b) => {
        const ah = a.height || 0;
        const bh = b.height || 0;
        if (bh !== ah) return bh - ah;
        return (b.bandwidth || 0) - (a.bandwidth || 0);
      });
    }

    function streamMasterSource(movie) {
      const stream = (movie.streams || []).find((s) => s?.url) || movie.streams?.[0];
      if (!stream?.url) return null;
      return {
        url: stream.url,
        referer: stream.referer || movie.referer || "",
        label: stream.bestQuality || null,
      };
    }

    function buildHlsProxyUrl(streamUrl, referer) {
      const params = new URLSearchParams({
        url: streamUrl,
        referer: referer || "",
      });
      return apiUrl(`hls-proxy?${params.toString()}`);
    }

    function stopStreamPlayback({ resetSelectors = true } = {}) {
      if (streamHls) {
        try {
          streamHls.destroy();
        } catch {
          // ignore
        }
        streamHls = null;
      }
      if (resetSelectors) {
        streamFallbackQualities = [];
        streamPlayerQuality.innerHTML = "";
        streamPlayerAudio.innerHTML = "";
        streamPlayerQuality.disabled = true;
        streamPlayerAudio.disabled = true;
      }
      streamPlayerVideo.removeAttribute("src");
      streamPlayerVideo.load();
    }

    function closeStreamPlayer() {
      stopStreamPlayback({ resetSelectors: true });
      streamPlayerEl.hidden = true;
      streamPlayerTitle.textContent = "Playing";
    }

    function fillSelect(select, options, selectedValue) {
      select.innerHTML = options
        .map(
          (opt) =>
            `<option value="${escapeAttr(String(opt.value))}"${
              String(opt.value) === String(selectedValue) ? " selected" : ""
            }>${escapeHtml(opt.label)}</option>`
        )
        .join("");
      select.disabled = options.length <= 1;
    }

    function hlsLevelLabel(level, index) {
      if (level?.height) return `${level.height}p`;
      if (level?.attrs?.RESOLUTION) {
        const parts = String(level.attrs.RESOLUTION).toLowerCase().split("x");
        if (parts[1]) return `${parts[1]}p`;
      }
      if (level?.bitrate) return `${Math.round(level.bitrate / 1000)} kbps`;
      return `Quality ${index + 1}`;
    }

    function hlsAudioLabel(track, index) {
      const parts = [];
      if (track?.name) parts.push(track.name);
      if (track?.lang) parts.push(track.lang);
      if (!parts.length && track?.groupId) parts.push(track.groupId);
      return parts.join(" · ") || `Audio ${index + 1}`;
    }

    function highestHlsLevelIndex(hls) {
      const levels = hls?.levels || [];
      if (!levels.length) return -1;
      let best = 0;
      for (let i = 1; i < levels.length; i += 1) {
        const cur = levels[i];
        const prev = levels[best];
        const ch = cur.height || 0;
        const ph = prev.height || 0;
        if (ch > ph || (ch === ph && (cur.bitrate || 0) > (prev.bitrate || 0))) {
          best = i;
        }
      }
      return best;
    }

    function refreshHlsTrackSelectors() {
      if (!streamHls) return;
      const levels = streamHls.levels || [];
      if (levels.length) {
        const selected = streamHls.currentLevel >= 0 ? streamHls.currentLevel : highestHlsLevelIndex(streamHls);
        fillSelect(
          streamPlayerQuality,
          levels.map((level, index) => ({
            value: String(index),
            label: hlsLevelLabel(level, index),
          })),
          String(selected)
        );
      } else if (streamFallbackQualities.length) {
        fillSelect(
          streamPlayerQuality,
          streamFallbackQualities.map((q, index) => ({
            value: String(index),
            label: q.label || `Quality ${index + 1}`,
          })),
          streamPlayerQuality.value || "0"
        );
      } else {
        fillSelect(streamPlayerQuality, [{ value: "0", label: "Auto" }], "0");
      }

      const audioTracks = streamHls.audioTracks || [];
      if (audioTracks.length) {
        fillSelect(
          streamPlayerAudio,
          audioTracks.map((track, index) => ({
            value: String(index),
            label: hlsAudioLabel(track, index),
          })),
          String(streamHls.audioTrack >= 0 ? streamHls.audioTrack : 0)
        );
      } else {
        fillSelect(streamPlayerAudio, [{ value: "0", label: "Default" }], "0");
      }
    }

    function playStreamSource(movie, source, { preferHighest = true } = {}) {
      if (!source?.url) {
        streamsMetaEl.textContent = `No playable stream for ${movie.title || "this title"}`;
        return;
      }
      const proxyUrl = buildHlsProxyUrl(source.url, source.referer || movie.referer || "");
      const fallbacks = streamQualities(movie);
      streamPlayerTitle.textContent = movie.title || "Stream";
      streamPlayerEl.hidden = false;
      stopStreamPlayback({ resetSelectors: true });
      streamFallbackQualities = fallbacks.length ? fallbacks : [source];

      const canNative = streamPlayerVideo.canPlayType("application/vnd.apple.mpegurl");
      if (window.Hls && Hls.isSupported()) {
        streamHls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          startLevel: -1,
        });
        streamHls.loadSource(proxyUrl);
        streamHls.attachMedia(streamPlayerVideo);
        streamHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (preferHighest && (streamHls.levels || []).length > 1) {
            streamHls.currentLevel = highestHlsLevelIndex(streamHls);
          }
          refreshHlsTrackSelectors();
          streamPlayerVideo.play().catch(() => {});
        });
        streamHls.on(Hls.Events.LEVEL_SWITCHED, refreshHlsTrackSelectors);
        streamHls.on(Hls.Events.AUDIO_TRACKS_UPDATED, refreshHlsTrackSelectors);
        streamHls.on(Hls.Events.AUDIO_TRACK_SWITCHED, refreshHlsTrackSelectors);
        streamHls.on(Hls.Events.ERROR, (_event, data) => {
          if (data?.fatal) {
            streamsMetaEl.textContent = `Playback error: ${data.type || "failed"}`;
          }
        });
      } else if (canNative) {
        // Safari: play master; in-player track switching is limited without hls.js.
        fillSelect(
          streamPlayerQuality,
          streamFallbackQualities.map((q, index) => ({
            value: String(index),
            label: q.label || `Quality ${index + 1}`,
          })),
          "0"
        );
        fillSelect(streamPlayerAudio, [{ value: "0", label: "Default" }], "0");
        streamPlayerVideo.src = proxyUrl;
        streamPlayerVideo.play().catch(() => {});
      } else {
        streamsMetaEl.textContent = "HLS playback is not supported in this browser.";
        closeStreamPlayer();
      }
    }

    function openStreamMovie(movie) {
      const master = streamMasterSource(movie);
      const qualities = streamQualities(movie);
      if (!master && !qualities.length) {
        streamsMetaEl.textContent = `No playable qualities for ${movie.title || "this title"}`;
        return;
      }
      // Prefer master playlist so HLS.js can expose levels + audio tracks.
      // Fall back to the highest probed quality URL.
      playStreamSource(movie, master || qualities[0], { preferHighest: true });
    }

    function renderStreamsCatalog(data) {
      const movies = data.movies || [];
      streamsCatalogMovies = movies;
      const refreshing = Boolean(data.refreshing);
      const playable = data.playable != null ? data.playable : movies.length;
      const parts = [
        `<strong>${playable}</strong> playable`,
        data.window ? `window: ${escapeHtml(data.window)}` : null,
        `updated: ${escapeHtml(formatStreamsTime(data.refreshedAt))}`,
        refreshing ? "<strong>refreshing…</strong>" : null,
        data.lastError ? `error: ${escapeHtml(data.lastError)}` : null,
      ].filter(Boolean);
      streamsMetaEl.innerHTML = parts.join(" · ");
      streamsRefreshBtn.disabled = refreshing;
      streamsRefreshBtn.textContent = refreshing ? "Refreshing…" : "Refresh catalog";

      if (!movies.length) {
        streamsContentEl.className = "streams-empty";
        streamsContentEl.textContent = refreshing
          ? "Catalog refresh in progress — titles will appear as they scrape."
          : "No playable streams in Redis yet. Click Refresh catalog or wait for the next scheduled run.";
        return;
      }

      streamsContentEl.className = "streams-grid";
      streamsContentEl.innerHTML = movies.map((movie, index) => {
        const labels = streamQualityLabels(movie);
        const poster = movie.poster
          ? `<img src="${escapeAttr(movie.poster)}" alt="" loading="lazy" />`
          : "No poster";
        const year = movie.year ? `<div class="stream-card-year">${escapeHtml(String(movie.year))}</div>` : "";
        const chips = labels.length
          ? `<div class="stream-card-qualities">${labels
              .map((label) => `<span class="stream-quality-chip">${escapeHtml(label)}</span>`)
              .join("")}</div>`
          : "";
        const manualBadge = movie.manual ? `<span class="stream-card-badge manual">Manual</span>` : "";
        const removeBtn =
          movie.manual && movie.id
            ? `<button type="button" class="stream-card-remove" data-manual-id="${escapeAttr(movie.id)}">Remove</button>`
            : "";
        return `
          <article class="stream-card" data-stream-index="${index}" tabindex="0" role="button" aria-label="Play ${escapeAttr(movie.title || "stream")}">
            <div class="stream-card-poster">
              ${poster}
              ${labels[0] ? `<span class="stream-card-badge">${escapeHtml(labels[0])}</span>` : ""}
              ${manualBadge}
              ${removeBtn}
              <div class="stream-card-play" aria-hidden="true"><span>▶</span></div>
            </div>
            <div class="stream-card-body">
              <div class="stream-card-title">${escapeHtml(movie.title || "Untitled")}</div>
              ${year}
              ${chips}
            </div>
          </article>
        `;
      }).join("");
    }

    async function addManualStreamFromForm() {
      const title = manualStreamTitle.value.trim();
      const url = manualStreamUrl.value.trim();
      const referer = manualStreamReferer.value.trim();
      if (!title || !url) {
        manualStreamStatus.className = "streams-add-status error";
        manualStreamStatus.textContent = "Title and m3u8 URL are required.";
        return;
      }

      manualStreamAddBtn.disabled = true;
      manualStreamAddBtn.textContent = "Adding…";
      manualStreamStatus.className = "streams-add-status";
      manualStreamStatus.textContent = "Saving to Redis…";

      try {
        const res = await fetch(apiUrl("streams/manual"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, url, referer: referer || undefined }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        manualStreamTitle.value = "";
        manualStreamUrl.value = "";
        manualStreamReferer.value = "";
        manualStreamStatus.className = "streams-add-status ok";
        manualStreamStatus.textContent = `Added “${data.movie?.title || title}” to cache.`;
        await loadStreamsCatalog();
      } catch (err) {
        manualStreamStatus.className = "streams-add-status error";
        manualStreamStatus.textContent = err.message;
      } finally {
        manualStreamAddBtn.disabled = false;
        manualStreamAddBtn.textContent = "Add";
      }
    }

    async function removeManualStreamFromUi(id) {
      if (!id) return;
      manualStreamStatus.className = "streams-add-status";
      manualStreamStatus.textContent = "Removing…";
      try {
        const res = await fetch(apiUrl(`streams/manual?id=${encodeURIComponent(id)}`), {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        manualStreamStatus.className = "streams-add-status ok";
        manualStreamStatus.textContent = "Removed from cache.";
        await loadStreamsCatalog();
      } catch (err) {
        manualStreamStatus.className = "streams-add-status error";
        manualStreamStatus.textContent = err.message;
      }
    }

    async function loadStreamsCatalog() {
      try {
        const res = await fetch(apiUrl("streams"));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        renderStreamsCatalog(data);
        if (data.refreshing) {
          if (!streamsPollTimer) {
            streamsPollTimer = setInterval(() => {
              loadStreamsCatalog().catch(() => {});
            }, 4000);
          }
        } else if (streamsPollTimer) {
          clearInterval(streamsPollTimer);
          streamsPollTimer = null;
        }
      } catch (err) {
        streamsMetaEl.textContent = "Failed to load streams catalog";
        streamsContentEl.className = "streams-empty";
        streamsContentEl.textContent = err.message;
      }
    }

    async function refreshStreamsCatalog() {
      streamsRefreshBtn.disabled = true;
      streamsRefreshBtn.textContent = "Starting…";
      try {
        const res = await fetch(apiUrl("streams/refresh"), { method: "POST" });
        const data = await res.json();
        if (!res.ok && res.status !== 202) throw new Error(data.error || res.statusText);
        await loadStreamsCatalog();
      } catch (err) {
        streamsMetaEl.textContent = err.message;
        streamsRefreshBtn.disabled = false;
        streamsRefreshBtn.textContent = "Refresh catalog";
      }
    }

    async function applyMainUrl() {
      const nextUrl = mainUrlInput.value.trim();
      if (!nextUrl) return;

      applyMainUrlBtn.disabled = true;
      applyMainUrlBtn.textContent = "Saving…";

      try {
        const res = await fetch(apiUrl("config"), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mainUrl: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        await load();
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
      } finally {
        applyMainUrlBtn.disabled = false;
        applyMainUrlBtn.textContent = "Apply";
      }
    }

    async function applySecondaryUrl() {
      const nextUrl = secondaryUrlInput.value.trim();

      applySecondaryUrlBtn.disabled = true;
      applySecondaryUrlBtn.textContent = "Saving…";

      try {
        const res = await fetch(apiUrl("config"), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ secondaryUrl: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        secondaryUrlInput.value = data.secondaryUrl || "";
        await load({ refresh: true });
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
      } finally {
        applySecondaryUrlBtn.disabled = false;
        applySecondaryUrlBtn.textContent = "Apply";
      }
    }

    async function applyCinebyUrl() {
      const nextUrl = cinebyUrlInput.value.trim();

      applyCinebyUrlBtn.disabled = true;
      applyCinebyUrlBtn.textContent = "Saving…";

      try {
        const res = await fetch(apiUrl("config"), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cinebyUrl: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        cinebyUrlInput.value = data.cinebyUrl || "";
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
      } finally {
        applyCinebyUrlBtn.disabled = false;
        applyCinebyUrlBtn.textContent = "Apply";
      }
    }

    async function load({ refresh = false } = {}) {
      const gen = ++loadGeneration;
      refreshBtn.disabled = true;
      allMovies = [];
      nextSourceOrder = 0;
      activePresets.clear();
      loadedThroughPage = 0;
      filtersEl.hidden = true;
      content.className = "state";
      content.textContent = "Loading movies…";

      try {
        const configRes = await fetch(apiUrl("config"));
        const config = await configRes.json();
        if (!configRes.ok) throw new Error("Failed to load config");

        totalMaxPages = config.maxPages;
        initialPagesCount = config.initialPages || 2;
        setupSourceConfig(config);

        const loadAllFromCache = config.cacheEnabled && !refresh;
        const toPage = loadAllFromCache
          ? totalMaxPages
          : Math.min(initialPagesCount, totalMaxPages);

        if (loadAllFromCache) {
          content.textContent = "Loading library from cache…";
        } else if (refresh) {
          content.textContent = "Refreshing from source…";
        }

        const data = await fetchPageRange(1, toPage, { refresh });
        if (gen !== loadGeneration) return;

        mergeMovies(data.movies || []);
        loadedThroughPage = data.to;
        tmdbEnabledFlag = data.tmdbEnabled;
        filtersEl.hidden = allMovies.length === 0;
        populateFilterOptions(allMovies);
        await refreshDownloadLibrary();
        await refreshDownloadJobs({ rerender: false });
        applyFiltersAndRender();
        refreshBtn.disabled = false;

        if (!loadAllFromCache && loadedThroughPage < totalMaxPages) {
          loadRemainingPages(gen, loadedThroughPage + 1, totalMaxPages, { refresh });
        }
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", () => load({ refresh: true }));
    streamsRefreshBtn.addEventListener("click", () => refreshStreamsCatalog());
    streamsContentEl.addEventListener("click", (e) => {
      const removeBtn = e.target.closest(".stream-card-remove");
      if (removeBtn) {
        e.preventDefault();
        e.stopPropagation();
        removeManualStreamFromUi(removeBtn.dataset.manualId);
        return;
      }
      const card = e.target.closest(".stream-card[data-stream-index]");
      if (!card) return;
      e.preventDefault();
      const movie = streamsCatalogMovies[Number(card.dataset.streamIndex)];
      if (movie) openStreamMovie(movie);
    });
    streamsContentEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (e.target.closest(".stream-card-remove")) return;
      const card = e.target.closest(".stream-card[data-stream-index]");
      if (!card) return;
      e.preventDefault();
      const movie = streamsCatalogMovies[Number(card.dataset.streamIndex)];
      if (movie) openStreamMovie(movie);
    });
    manualStreamAddBtn.addEventListener("click", () => addManualStreamFromForm());
    [manualStreamTitle, manualStreamUrl, manualStreamReferer].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addManualStreamFromForm();
      });
    });
    streamPlayerQuality.addEventListener("change", () => {
      const index = Number(streamPlayerQuality.value);
      if (streamHls && (streamHls.levels || []).length) {
        streamHls.currentLevel = index;
        return;
      }
      // Safari / single-rendition fallback: reload a probed quality URL.
      const quality = streamFallbackQualities[index];
      if (!quality?.url) return;
      const title = streamPlayerTitle.textContent || "Stream";
      const preserved = streamFallbackQualities.slice();
      const currentTime = streamPlayerVideo.currentTime || 0;
      stopStreamPlayback({ resetSelectors: false });
      streamFallbackQualities = preserved;
      const proxyUrl = buildHlsProxyUrl(quality.url, quality.referer || "");
      fillSelect(
        streamPlayerQuality,
        preserved.map((q, i) => ({
          value: String(i),
          label: q.label || `Quality ${i + 1}`,
        })),
        String(index)
      );
      fillSelect(streamPlayerAudio, [{ value: "0", label: "Default" }], "0");
      streamPlayerTitle.textContent = title;
      streamPlayerVideo.src = proxyUrl;
      streamPlayerVideo.addEventListener(
        "loadedmetadata",
        () => {
          if (currentTime > 0 && Number.isFinite(currentTime)) {
            try {
              streamPlayerVideo.currentTime = currentTime;
            } catch {
              // ignore
            }
          }
          streamPlayerVideo.play().catch(() => {});
        },
        { once: true }
      );
    });
    streamPlayerAudio.addEventListener("change", () => {
      if (!streamHls) return;
      streamHls.audioTrack = Number(streamPlayerAudio.value);
    });
    streamPlayerClose.addEventListener("click", closeStreamPlayer);
    streamPlayerEl.addEventListener("click", (e) => {
      if (e.target === streamPlayerEl) closeStreamPlayer();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !streamPlayerEl.hidden) closeStreamPlayer();
    });
    navItems.forEach((item) => {
      item.addEventListener("click", () => setView(item.dataset.view));
    });
    window.addEventListener("hashchange", () => setView(viewFromHash(), { updateHash: false }));
    applyMainUrlBtn.addEventListener("click", applyMainUrl);
    mainUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") applyMainUrl();
    });
    applySecondaryUrlBtn.addEventListener("click", applySecondaryUrl);
    secondaryUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") applySecondaryUrl();
    });
    applyCinebyUrlBtn.addEventListener("click", applyCinebyUrl);
    cinebyUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") applyCinebyUrl();
    });

    content.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-download-link]");
      if (!btn) return;
      e.preventDefault();
      openDownloadModal(
        btn.dataset.downloadLink,
        btn.dataset.downloadTitle,
        btn.dataset.tmdbId || null,
        btn.dataset.source || "",
        btn.dataset.mediaType || "",
        btn.dataset.seasons || "[]",
        btn.dataset.seasonHint || ""
      );
    });

    document.getElementById("download-modal-close").addEventListener("click", closeDownloadModal);
    downloadModal.addEventListener("click", (e) => {
      if (e.target === downloadModal) closeDownloadModal();
    });

    downloadModalContent.addEventListener("click", async (e) => {
      const picker = e.target.closest(".download-picker");
      if (picker) {
        e.preventDefault();
        try {
          await loadDirectDownloads(picker.dataset.url, picker.dataset.label);
        } catch (err) {
          downloadModalContent.className = "download-state";
          downloadModalContent.textContent = err.message;
        }
        return;
      }

      const serverBtn = e.target.closest(".server-download");
      if (serverBtn) {
        e.preventDefault();
        try {
          await startServerDownload(serverBtn);
        } catch (err) {
          serverBtn.disabled = false;
          serverBtn.classList.add("failed");
          serverBtn.textContent = `${serverBtn.dataset.label} — ${err.message}`;
        }
        return;
      }

      const backBtn = e.target.closest(".download-back");
      if (backBtn) {
        e.preventDefault();
        downloadModalContent.innerHTML = renderQualityOptions(downloadModalState.options);
      }
    });

    [searchInput, sortSelect, typeFilter, genreFilter, yearFilter, qualityFilter].forEach((el) => {
      el.addEventListener("input", applyFiltersAndRender);
      el.addEventListener("change", applyFiltersAndRender);
    });

    document.querySelectorAll(".chip[data-preset]").forEach((chip) => {
      chip.addEventListener("click", () => togglePreset(chip.dataset.preset));
    });

    setView(viewFromHash(), { updateHash: true });
    load();
    // Warm the streams catalog in the background even on Library.
    if (activeView !== "streams") {
      loadStreamsCatalog().catch(() => {});
    }
  </script>
</body>
</html>

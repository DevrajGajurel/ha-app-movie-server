    function parseSeasonHint(seasonsText) {
      const text = String(seasonsText || "");
      const range = text.match(/S(\d{1,2})\s*-\s*S(\d{1,2})/i);
      if (range) {
        return { from: Number.parseInt(range[1], 10), to: Number.parseInt(range[2], 10) };
      }
      const single = text.match(/S(\d{1,2})/i);
      if (single) {
        const n = Number.parseInt(single[1], 10);
        return { from: n, to: n };
      }
      return null;
    }

    function buildSeasonOptions(seasonsJson, seasonHint) {
      let seasons = [];
      try {
        seasons = JSON.parse(seasonsJson || "[]");
      } catch {
        seasons = [];
      }
      if (Array.isArray(seasons) && seasons.length) {
        return seasons
          .filter((s) => Number(s.seasonNumber) > 0)
          .map((s) => ({
            seasonNumber: Number(s.seasonNumber),
            episodeCount: Number(s.episodeCount) || 24,
            name: s.name || `Season ${s.seasonNumber}`,
          }));
      }

      const hint = parseSeasonHint(seasonHint);
      const from = hint?.from || 1;
      const to = hint?.to || 1;
      const options = [];
      for (let n = from; n <= to; n++) {
        options.push({ seasonNumber: n, episodeCount: 24, name: `Season ${n}` });
      }
      return options.length ? options : [{ seasonNumber: 1, episodeCount: 24, name: "Season 1" }];
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function renderEpisodePicker(seasons, selectedSeason, selectedEpisode) {
      const seasonMeta = seasons.find((s) => s.seasonNumber === selectedSeason) || seasons[0];
      const episodeCount = Math.max(1, Number(seasonMeta?.episodeCount) || 24);
      const seasonOptions = seasons
        .map(
          (s) =>
            `<option value="${s.seasonNumber}"${s.seasonNumber === selectedSeason ? " selected" : ""}>${escapeHtml(
              s.name || `Season ${s.seasonNumber}`
            )}</option>`
        )
        .join("");
      const episodeOptions = Array.from({ length: episodeCount }, (_, i) => i + 1)
        .map(
          (ep) =>
            `<option value="${ep}"${ep === selectedEpisode ? " selected" : ""}>Episode ${ep}</option>`
        )
        .join("");

      return `
        <div class="episode-picker">
          <p class="download-save-hint">Download a full season (highest quality, with link fallback), or pick one episode.</p>
          <div class="episode-picker-row">
            <label for="shegu-season">Season</label>
            <select id="shegu-season">${seasonOptions}</select>
          </div>
          <button type="button" class="btn-secondary" id="shegu-download-season">Download entire season</button>
          <div id="shegu-season-status" class="download-save-hint" hidden></div>
          <hr style="border:0;border-top:1px solid var(--border);margin:0.25rem 0;">
          <div class="episode-picker-row">
            <label for="shegu-episode">Episode</label>
            <select id="shegu-episode">${episodeOptions}</select>
          </div>
          <button type="button" class="btn-secondary" id="shegu-load-episode">Load episode downloads</button>
        </div>
        <div id="shegu-episode-results"></div>
      `;
    }

    async function startSeasonDownloadFromPicker() {
      const season = Number.parseInt(document.getElementById("shegu-season")?.value, 10);
      const seasons = Array.isArray(downloadModalState.seasons) ? downloadModalState.seasons : [];
      const seasonMeta = seasons.find((s) => s.seasonNumber === season) || seasons[0];
      const episodeCount = Math.max(1, Number(seasonMeta?.episodeCount) || 24);
      const statusEl = document.getElementById("shegu-season-status");
      const btn = document.getElementById("shegu-download-season");
      if (!downloadModalState.tmdbId || !btn) return;

      btn.disabled = true;
      btn.textContent = "Starting season download…";
      if (statusEl) {
        statusEl.hidden = false;
        statusEl.textContent = `Queuing S${pad2(season)} (${episodeCount} episodes)…`;
      }

      const res = await fetch(apiUrl("downloads/season"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tmdbId: downloadModalState.tmdbId,
          season,
          episodeCount,
          movieTitle: downloadModalState.baseTitle || downloadModalState.movieTitle,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      await refreshDownloadJobs();
      startJobPolling(data.job.id, btn, `Download entire season (S${pad2(season)})`, () => {
        refreshDownloadLibrary().then(() => applyFiltersAndRender());
      });
      if (statusEl) {
        statusEl.textContent = `Season download running in the background — highest quality per episode, with fallback links.`;
      }
    }

    async function loadSecondaryEpisodeDownloads() {
      const season = Number.parseInt(document.getElementById("shegu-season")?.value, 10);
      const episode = Number.parseInt(document.getElementById("shegu-episode")?.value, 10);
      const resultsEl = document.getElementById("shegu-episode-results");
      if (!resultsEl || !downloadModalState.tmdbId) return;

      resultsEl.innerHTML = `<p class="download-state">Loading S${pad2(season)}E${pad2(episode)}…</p>`;

      const params = new URLSearchParams({
        source: "secondary",
        tmdbId: String(downloadModalState.tmdbId),
        mediaType: "tv",
        season: String(season),
        episode: String(episode),
      });
      const res = await fetch(apiUrl(`downloads?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      const episodeTitle = `${downloadModalState.baseTitle || downloadModalState.movieTitle} S${pad2(season)}E${pad2(episode)}`;
      downloadModalState.movieTitle = episodeTitle;
      downloadModalState.season = season;
      downloadModalState.episode = episode;

      if (!data.options?.length) {
        resultsEl.innerHTML = `
          <p>No download links found for S${pad2(season)}E${pad2(episode)}.</p>
          ${renderSelectorDebug(data.selectors)}
        `;
        return;
      }

      resultsEl.innerHTML = renderDirectOptions(
        data.options,
        `S${pad2(season)}E${pad2(episode)}`,
        episodeTitle,
        downloadModalState.tmdbId,
        { showBack: false }
      );
    }

    function wireEpisodePicker(seasons) {
      downloadModalState.seasons = seasons;
      const seasonSelect = document.getElementById("shegu-season");
      const episodeSelect = document.getElementById("shegu-episode");
      const loadBtn = document.getElementById("shegu-load-episode");
      const seasonBtn = document.getElementById("shegu-download-season");

      seasonSelect?.addEventListener("change", () => {
        const selected = Number.parseInt(seasonSelect.value, 10);
        const meta = seasons.find((s) => s.seasonNumber === selected) || seasons[0];
        const count = Math.max(1, Number(meta?.episodeCount) || 24);
        episodeSelect.innerHTML = Array.from({ length: count }, (_, i) => i + 1)
          .map((ep) => `<option value="${ep}">Episode ${ep}</option>`)
          .join("");
      });

      loadBtn?.addEventListener("click", async () => {
        try {
          await loadSecondaryEpisodeDownloads();
        } catch (err) {
          const resultsEl = document.getElementById("shegu-episode-results");
          if (resultsEl) resultsEl.textContent = err.message;
        }
      });

      seasonBtn?.addEventListener("click", async () => {
        try {
          await startSeasonDownloadFromPicker();
        } catch (err) {
          seasonBtn.disabled = false;
          seasonBtn.textContent = "Download entire season";
          const statusEl = document.getElementById("shegu-season-status");
          if (statusEl) {
            statusEl.hidden = false;
            statusEl.textContent = err.message;
          }
        }
      });
    }

    async function openDownloadModal(pageUrl, title, tmdbId, source, mediaType, seasonsJson, seasonHint) {
      downloadModalTitle.textContent = title || "Download options";
      downloadModalContent.className = "download-state";
      downloadModalContent.textContent = "Loading download options…";
      downloadModal.hidden = false;

      try {
        const isSecondary = String(source || "").toLowerCase() === "secondary";
        if (isSecondary) {
          if (!tmdbId) {
            downloadModalContent.className = "download-state";
            downloadModalContent.textContent = "No TMDB match — cannot load secondary downloads.";
            return;
          }

          const isTv = String(mediaType || "").toLowerCase() === "tv" || Boolean(seasonHint);
          downloadModalState = {
            title: title || "Download options",
            options: [],
            movieTitle: title || "",
            baseTitle: title || "",
            tmdbId: tmdbId || null,
            source: "secondary",
            mediaType: isTv ? "tv" : "movie",
          };

          if (isTv) {
            const seasons = buildSeasonOptions(seasonsJson, seasonHint);
            const firstSeason = seasons[0]?.seasonNumber || 1;
            downloadModalContent.innerHTML = renderEpisodePicker(seasons, firstSeason, 1);
            wireEpisodePicker(seasons);
            return;
          }

          const res = await fetch(
            apiUrl(`downloads?source=secondary&tmdbId=${encodeURIComponent(tmdbId)}&mediaType=movie`)
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);

          downloadModalState.options = data.options || [];

          if (!data.options?.length) {
            downloadModalContent.className = "download-state";
            downloadModalContent.innerHTML = `
              <p>No download links found for this title.</p>
              ${renderSelectorDebug(data.selectors)}
            `;
            return;
          }

          downloadModalContent.innerHTML = renderDirectOptions(
            data.options,
            null,
            downloadModalState.movieTitle,
            downloadModalState.tmdbId,
            { showBack: false }
          );
          return;
        }

        const res = await fetch(apiUrl(`downloads?url=${encodeURIComponent(pageUrl)}`));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        if (!data.options?.length) {
          downloadModalContent.className = "download-state";
          downloadModalContent.innerHTML = `
            <p>No download links found on this page.</p>
            ${renderSelectorDebug(data.selectors)}
            <a class="download-option" href="${escapeAttr(pageUrl)}" target="_blank" rel="noopener noreferrer">Open source page</a>
          `;
          return;
        }

        downloadModalState = {
          title: title || "Download options",
          options: data.options,
          movieTitle: title || "",
          tmdbId: tmdbId || null,
          source: "",
        };
        downloadModalContent.innerHTML = renderQualityOptions(data.options);
      } catch (err) {
        downloadModalContent.className = "download-state";
        downloadModalContent.textContent = err.message;
      }
    }

    function setupSourceConfig(config) {
      if (!config?.configEditable) {
        sourceConfigEl.hidden = true;
        return;
      }

      sourceConfigEl.hidden = false;
      mainUrlInput.value = config.mainUrl || "";
      secondaryUrlInput.value = config.secondaryUrl || "";
    }

    const viewDownloadsEl = document.getElementById("view-downloads");

    const VALID_VIEWS = ["library", "downloads"];

    function setView(view, { updateHash = true } = {}) {
      const next = VALID_VIEWS.includes(view) ? view : "library";
      activeView = next;
      viewLibraryEl.hidden   = next !== "library";
      viewDownloadsEl.hidden = next !== "downloads";
      navItems.forEach((item) => {
        const on = item.dataset.view === next;
        item.classList.toggle("active", on);
        if (on) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });
      if (updateHash) {
        const hash = next === "library" ? "#library" : `#${next}`;
        if (location.hash !== hash) history.replaceState(null, "", hash);
      }
      if (next === "downloads") loadDownloadsView();
    }

    function viewFromHash() {
      const hash = (location.hash || "").replace(/^#/, "").toLowerCase();
      return VALID_VIEWS.includes(hash) ? hash : "library";
    }

    // ── Downloads view ───────────────────────────────────────────────────

    const downloadsContentEl  = document.getElementById("downloads-content");
    const downloadsNavBadge   = document.getElementById("downloads-nav-badge");
    const downloadsRefreshBtn = document.getElementById("downloads-refresh-btn");
    let downloadsActiveTab    = "active";
    let downloadsViewPoller   = null;

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "";
      if (bytes >= 1073741824) return `${(bytes / 1073741824).toFixed(1)} GB`;
      if (bytes >= 1048576)    return `${(bytes / 1048576).toFixed(1)} MB`;
      if (bytes >= 1024)       return `${(bytes / 1024).toFixed(0)} KB`;
      return `${bytes} B`;
    }

    function renderJobCard(job) {
      const pct      = job.totalBytes > 0 ? Math.min(100, Math.round(job.receivedBytes / job.totalBytes * 100)) : 0;
      const isActive = job.status === "queued" || job.status === "downloading";

      let statusClass = job.status;
      if (isActive) statusClass = "active";

      let statusLabel = job.status;
      if (job.type === "season") {
        const done  = (job.completedEpisodes || 0) + (job.skippedEpisodes || 0);
        const total = job.episodeCount || 0;
        if (job.status === "downloading") {
          const ep = job.currentEpisode ? ` · E${String(job.currentEpisode).padStart(2,"0")}` : "";
          statusLabel = `${done}/${total} eps${ep}`;
        } else if (job.status === "completed") {
          statusLabel = job.failedEpisodes ? `Done (${job.failedEpisodes} failed)` : "Complete";
        } else {
          statusLabel = job.status;
        }
      } else if (job.status === "downloading") {
        statusLabel = job.totalBytes > 0 ? `${pct}%` : "Downloading…";
      } else if (job.status === "completed") {
        statusLabel = "Saved";
      } else if (job.status === "queued") {
        statusLabel = "Queued";
      } else if (job.status === "failed") {
        statusLabel = "Failed";
      }

      const progressBar = (job.status === "downloading" && job.type !== "season" && job.totalBytes > 0)
        ? `<div class="job-progress-row"><div class="job-progress-bar" style="--progress:${pct}%"><span></span></div></div>` : "";

      const seasonRow = job.type === "season"
        ? `<div class="job-season-row">Season ${job.season} · ${job.episodeCount} episode(s) · ${job.completedEpisodes || 0} done · ${job.failedEpisodes || 0} failed · ${job.skippedEpisodes || 0} skipped</div>` : "";

      const errorRow = job.status === "failed" && job.error
        ? `<div class="job-error">${escapeHtml(job.error)}</div>` : "";

      const redownloadRow = (job.status === "completed" || job.status === "failed")
        ? `<div class="job-actions"><button type="button" class="job-redownload-btn" data-redownload-job="${job.id}">Redownload</button></div>` : "";

      const sizeHint = (job.receivedBytes > 0 || job.totalBytes > 0)
        ? `${formatBytes(job.receivedBytes)}${job.totalBytes > 0 ? ` / ${formatBytes(job.totalBytes)}` : ""}` : "";

      const attempt = job.attemptsTotal > 1 ? ` · attempt ${job.attempt}/${job.attemptsTotal}` : "";
      const meta = [
        job.startedAt ? new Date(job.startedAt).toLocaleString() : null,
        sizeHint,
        attempt ? attempt.trim() : null,
        job.filePath ? escapeHtml(job.filePath.split(/[\\/]/).pop()) : null,
      ].filter(Boolean).join(" · ");

      return `
        <div class="job-card ${statusClass}" data-job-id="${job.id}">
          <div class="job-title">${escapeHtml(job.movieTitle || job.label || `Job #${job.id}`)}</div>
          <span class="job-status-badge ${job.status}">${escapeHtml(statusLabel)}</span>
          ${meta ? `<div class="job-meta">${meta}</div>` : ""}
          ${seasonRow}
          ${progressBar}
          ${errorRow}
          ${redownloadRow}
        </div>`;
    }

    function filterJobsByTab(jobs, tab) {
      if (tab === "active")    return jobs.filter(j => j.status === "queued" || j.status === "downloading");
      if (tab === "failed")    return jobs.filter(j => j.status === "failed");
      if (tab === "completed") return jobs.filter(j => j.status === "completed");
      return jobs; // "all"
    }

    function renderDownloadsView(jobs) {
      const filtered = filterJobsByTab(jobs, downloadsActiveTab);

      // Update nav badge with active job count
      const activeCount = jobs.filter(j => j.status === "queued" || j.status === "downloading").length;
      if (activeCount > 0) {
        downloadsNavBadge.textContent = String(activeCount);
        downloadsNavBadge.hidden = false;
      } else {
        downloadsNavBadge.hidden = true;
      }

      if (!filtered.length) {
        const labels = { active: "No active downloads", all: "No jobs yet", failed: "No failed downloads", completed: "No completed downloads" };
        downloadsContentEl.className = "downloads-empty";
        downloadsContentEl.textContent = labels[downloadsActiveTab] || "Nothing here";
        return;
      }

      downloadsContentEl.className = "job-list";
      downloadsContentEl.innerHTML = filtered.map(renderJobCard).join("");
    }

    async function loadDownloadsView({ silent = false } = {}) {
      if (!silent) {
        downloadsContentEl.className = "downloads-empty";
        downloadsContentEl.textContent = "Loading…";
      }
      try {
        const res  = await fetch(apiUrl("downloads/jobs"));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        downloadJobs = data.jobs || [];
        renderDownloadsView(downloadJobs);
        updateDownloadsViewPoller();
      } catch (err) {
        if (!silent) {
          downloadsContentEl.className = "downloads-empty";
          downloadsContentEl.textContent = err.message;
        }
      }
    }

    function updateDownloadsViewPoller() {
      const hasActive = downloadJobs.some(j => j.status === "queued" || j.status === "downloading");
      if (activeView === "downloads" && hasActive && !downloadsViewPoller) {
        downloadsViewPoller = setInterval(() => loadDownloadsView({ silent: true }), 2000);
      } else if ((!hasActive || activeView !== "downloads") && downloadsViewPoller) {
        clearInterval(downloadsViewPoller);
        downloadsViewPoller = null;
      }
    }

    // Tab switching
    document.querySelectorAll(".downloads-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        downloadsActiveTab = btn.dataset.tab;
        document.querySelectorAll(".downloads-tab").forEach(b => b.classList.toggle("active", b === btn));
        renderDownloadsView(downloadJobs);
      });
    });

    downloadsRefreshBtn.addEventListener("click", () => loadDownloadsView());

    downloadsContentEl.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-redownload-job]");
      if (!btn) return;
      const jobId = Number.parseInt(btn.dataset.redownloadJob, 10);
      btn.disabled = true;
      btn.textContent = "Starting…";
      try {
        const res = await fetch(apiUrl("downloads/redownload"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jobId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        downloadsActiveTab = "active";
        document.querySelectorAll(".downloads-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === "active"));
        await loadDownloadsView();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Redownload";
        alert(`Redownload failed: ${err.message}`);
      }
    });

    async function applyMainUrl() {
      const nextUrl = mainUrlInput.value.trim();
      if (!nextUrl) return;

      applyMainUrlBtn.disabled = true;
      applyMainUrlBtn.textContent = "Saving…";

      try {
        const res = await fetch(apiUrl("config"), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mainUrl: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        await load();
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
      } finally {
        applyMainUrlBtn.disabled = false;
        applyMainUrlBtn.textContent = "Apply";
      }
    }

    async function applySecondaryUrl() {
      const nextUrl = secondaryUrlInput.value.trim();

      applySecondaryUrlBtn.disabled = true;
      applySecondaryUrlBtn.textContent = "Saving…";

      try {
        const res = await fetch(apiUrl("config"), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ secondaryUrl: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        secondaryUrlInput.value = data.secondaryUrl || "";
        await load({ refresh: true });
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
      } finally {
        applySecondaryUrlBtn.disabled = false;
        applySecondaryUrlBtn.textContent = "Apply";
      }
    }

    async function load({ refresh = false } = {}) {
      const gen = ++loadGeneration;
      refreshBtn.disabled = true;
      allMovies = [];
      nextSourceOrder = 0;
      activePresets.clear();
      loadedThroughPage = 0;
      filtersEl.hidden = true;
      content.className = "state";
      content.textContent = "Loading movies…";

      try {
        const configRes = await fetch(apiUrl("config"));
        const config = await configRes.json();
        if (!configRes.ok) throw new Error("Failed to load config");

        totalMaxPages = config.maxPages;
        initialPagesCount = config.initialPages || 2;
        setupSourceConfig(config);

        const loadAllFromCache = config.cacheEnabled && !refresh;
        const toPage = loadAllFromCache
          ? totalMaxPages
          : Math.min(initialPagesCount, totalMaxPages);

        if (loadAllFromCache) {
          content.textContent = "Loading library from cache…";
        } else if (refresh) {
          content.textContent = "Refreshing from source…";
        }

        const data = await fetchPageRange(1, toPage, { refresh });
        if (gen !== loadGeneration) return;

        mergeMovies(data.movies || []);
        loadedThroughPage = data.to;
        tmdbEnabledFlag = data.tmdbEnabled;
        filtersEl.hidden = allMovies.length === 0;
        populateFilterOptions(allMovies);
        await refreshDownloadLibrary();
        await refreshDownloadJobs({ rerender: false });
        applyFiltersAndRender();
        refreshBtn.disabled = false;

        if (!loadAllFromCache && loadedThroughPage < totalMaxPages) {
          loadRemainingPages(gen, loadedThroughPage + 1, totalMaxPages, { refresh });
        }
      } catch (err) {
        content.className = "state error";
        content.textContent = err.message;
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", () => load({ refresh: true }));
    navItems.forEach((item) => {
      item.addEventListener("click", () => {
        // Stop downloads poller when leaving that view
        if (activeView === "downloads" && item.dataset.view !== "downloads" && downloadsViewPoller) {
          clearInterval(downloadsViewPoller);
          downloadsViewPoller = null;
        }
        setView(item.dataset.view);
      });
    });
    window.addEventListener("hashchange", () => setView(viewFromHash(), { updateHash: false }));
    applyMainUrlBtn.addEventListener("click", applyMainUrl);
    mainUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") applyMainUrl();
    });
    applySecondaryUrlBtn.addEventListener("click", applySecondaryUrl);
    secondaryUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") applySecondaryUrl();
    });
    content.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-download-link]");
      if (!btn) return;
      e.preventDefault();
      openDownloadModal(
        btn.dataset.downloadLink,
        btn.dataset.downloadTitle,
        btn.dataset.tmdbId || null,
        btn.dataset.source || "",
        btn.dataset.mediaType || "",
        btn.dataset.seasons || "[]",
        btn.dataset.seasonHint || ""
      );
    });

    document.getElementById("download-modal-close").addEventListener("click", closeDownloadModal);
    downloadModal.addEventListener("click", (e) => {
      if (e.target === downloadModal) closeDownloadModal();
    });

    downloadModalContent.addEventListener("click", async (e) => {
      const picker = e.target.closest(".download-picker");
      if (picker) {
        e.preventDefault();
        try {
          await loadDirectDownloads(picker.dataset.url, picker.dataset.label);
        } catch (err) {
          downloadModalContent.className = "download-state";
          downloadModalContent.textContent = err.message;
        }
        return;
      }

      const serverBtn = e.target.closest(".server-download");
      if (serverBtn) {
        e.preventDefault();
        try {
          await startServerDownload(serverBtn);
        } catch (err) {
          serverBtn.disabled = false;
          serverBtn.classList.add("failed");
          serverBtn.textContent = `${serverBtn.dataset.label} — ${err.message}`;
        }
        return;
      }

      const backBtn = e.target.closest(".download-back");
      if (backBtn) {
        e.preventDefault();
        downloadModalContent.innerHTML = renderQualityOptions(downloadModalState.options);
      }
    });

    [searchInput, sortSelect, typeFilter, genreFilter, yearFilter, qualityFilter].forEach((el) => {
      el.addEventListener("input", applyFiltersAndRender);
      el.addEventListener("change", applyFiltersAndRender);
    });

    document.querySelectorAll(".chip[data-preset]").forEach((chip) => {
      chip.addEventListener("click", () => togglePreset(chip.dataset.preset));
    });

    setView(viewFromHash(), { updateHash: true });
    load();
    // Keep the nav badge up-to-date by polling jobs lightly in the background.
    setInterval(() => {
      fetch(apiUrl("downloads/jobs"))
        .then(r => r.json())
        .then(data => {
          downloadJobs = data.jobs || [];
          const activeCount = downloadJobs.filter(j => j.status === "queued" || j.status === "downloading").length;
          if (activeCount > 0) {
            downloadsNavBadge.textContent = String(activeCount);
            downloadsNavBadge.hidden = false;
          } else {
            downloadsNavBadge.hidden = true;
          }
          // If we're on the downloads view, refresh it silently too
          if (activeView === "downloads") renderDownloadsView(downloadJobs);
          updateDownloadJobsPoller();
        })
        .catch(() => {});
    }, 5000);
  </script>
</body>
</html>

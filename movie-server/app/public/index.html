<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Movie Server</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --danger: #ff6b6b;
      --success: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .app-shell {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .sidebar {
      width: 12.5rem;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar-brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 0.55rem;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .nav-item:hover:not(:disabled) {
      background: rgba(108, 140, 255, 0.08);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(108, 140, 255, 0.14);
      border-color: rgba(108, 140, 255, 0.35);
      color: var(--text);
    }

    .nav-item-icon {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .app-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .view[hidden] {
      display: none !important;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    main { padding: 1.5rem; max-width: 1200px; width: 100%; margin: 0 auto; }

    .filters {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 0;
    }

    .filters[hidden] { display: none; }

    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .filters-row input,
    .filters-row select,
    .source-config-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
    }

    .filters-row input { flex: 1; min-width: 160px; }
    .filters-row select { min-width: 130px; }

    #refresh {
      margin-left: auto;
      flex-shrink: 0;
    }

    .filters-row input:focus,
    .filters-row select:focus,
    .source-config-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .chip:hover,
    .chip.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(108, 140, 255, 0.1);
    }

    .filter-count {
      margin-top: 0.65rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .source-config-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .source-config-panel {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem 0;
    }

    .source-config-panel[hidden] {
      display: none;
    }

    .source-config-row label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .source-config-row input {
      min-width: 0;
    }

    .empty-actions {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .empty-hint {
      max-width: 520px;
      margin: 0.5rem auto 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .selector-debug {
      margin: 0.75rem 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.78rem;
      text-align: left;
    }

    .selector-debug code {
      display: block;
      margin-top: 0.35rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .genre-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .genre-tag {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      background: rgba(108, 140, 255, 0.12);
      color: var(--accent);
    }

    .state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .state.error { color: var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .poster {
      aspect-ratio: 2 / 3;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      padding: 0.5rem;
      position: relative;
    }

    .quality-badges {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      align-items: flex-end;
    }

    .quality-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .quality-badge.hd {
      background: rgba(74, 222, 128, 0.9);
      color: #0f1117;
    }

    .quality-badge.k4 {
      background: rgba(251, 191, 36, 0.95);
      color: #0f1117;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 0.85rem; }

    .card h2 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scraped-title {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .rating {
      color: #fbbf24;
      font-weight: 600;
    }

    .type-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }

    .type-badge.tv {
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.12);
    }

    .overview {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card a {
      color: var(--accent);
      font-size: 0.75rem;
      text-decoration: none;
      word-break: break-all;
    }

    .card a:hover { text-decoration: underline; }

    .empty { color: var(--muted); font-size: 0.9rem; }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    footer a { color: var(--accent); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-backdrop[hidden] { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: min(100%, 480px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }

    .modal p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .modal p code {
      color: var(--text);
      font-size: 0.8rem;
    }

    .modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .modal input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff8585;
    }

    .download-link {
      cursor: pointer;
    }
    .download-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      max-height: 360px;
      overflow-y: auto;
    }

    .download-option {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color 0.15s;
      text-align: left;
      cursor: pointer;
    }

    button.download-option {
      font-family: inherit;
    }

    .download-back {
      margin-bottom: 0.75rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }

    .download-option:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    .download-option span {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 0.25rem;
      word-break: break-all;
    }

    button.download-option:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .download-option.saved {
      border-color: var(--success);
    }

    .download-option.failed {
      border-color: var(--danger);
    }

    .download-save-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .episode-picker {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .episode-picker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .episode-picker label {
      min-width: 4.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .episode-picker select {
      flex: 1;
      min-width: 8rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
    }

    .episode-picker .btn-secondary {
      width: 100%;
    }

    .card-download-status {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-download-status .download-active-label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .download-progress {
      height: 6px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .download-progress.thin {
      height: 4px;
      margin-top: 0.25rem;
    }

    .download-progress span {
      display: block;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
      transition: width 0.2s;
    }

    .download-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      border: none;
      cursor: default;
      flex-shrink: 0;
    }

    .download-badge svg {
      width: 1rem;
      height: 1rem;
      display: block;
    }

    .download-badge.downloaded {
      position: absolute;
      bottom: 0.5rem;
      left: 0.5rem;
      background: rgba(74, 222, 128, 0.95);
      color: #0f1117;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .download-badge.failed {
      background: rgba(255, 107, 107, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.4);
    }

    .download-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 12rem;
      max-width: 18rem;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.68rem;
      line-height: 1.35;
      word-break: break-all;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s, visibility 0.15s;
      z-index: 5;
    }

    .download-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--border);
    }

    .download-badge:hover .download-tooltip,
    .download-badge:focus .download-tooltip,
    .download-badge:focus-within .download-tooltip {
      opacity: 1;
      visibility: visible;
    }

    .card-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(108, 140, 255, 0.08);
      font-weight: 500;
    }

    .card-action-btn:hover {
      background: rgba(108, 140, 255, 0.16);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .app-shell {
        flex-direction: column;
        padding-bottom: calc(3.75rem + env(safe-area-inset-bottom, 0px));
      }

      .sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        width: 100%;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.65rem calc(0.45rem + env(safe-area-inset-bottom, 0px));
        border-right: none;
        border-top: 1px solid var(--border);
        z-index: 40;
      }

      .sidebar-brand {
        display: none;
      }

      .sidebar-nav {
        flex-direction: row;
        width: 100%;
        gap: 0.4rem;
      }

      .nav-item {
        flex: 1;
        justify-content: center;
        padding: 0.7rem 0.5rem;
      }

      main,
      .filters,
      .source-config-panel {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }

      main {
        padding-top: 0.75rem;
        padding-bottom: 1.25rem;
      }

      .filters {
        padding-top: 0.75rem;
      }

      .filters-panel {
        padding: 0.75rem;
        border-radius: 10px;
      }

      .filters-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .filters-row input[type="search"] {
        grid-column: 1 / -1;
        min-width: 0;
        width: 100%;
        font-size: 1rem;
        padding: 0.65rem 0.75rem;
      }

      .source-config-row {
        grid-template-columns: 1fr;
      }

      .filters-row select {
        min-width: 0;
        width: 100%;
        font-size: 0.9rem;
        padding: 0.6rem 0.5rem;
      }

      #refresh {
        grid-column: 1 / -1;
        margin-left: 0;
        width: 100%;
        min-height: 2.75rem;
        font-size: 0.95rem;
      }

      .filter-chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        margin-top: 0.65rem;
        padding-bottom: 0.15rem;
        gap: 0.45rem;
      }

      .filter-chips::-webkit-scrollbar {
        display: none;
      }

      .chip {
        flex-shrink: 0;
        padding: 0.45rem 0.85rem;
        font-size: 0.8rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0.65rem;
      }

      .card {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        border-radius: 10px;
      }

      .card:hover {
        transform: none;
      }

      .poster {
        position: relative;
        width: 7.5rem;
        min-width: 7.5rem;
        aspect-ratio: auto;
        align-self: stretch;
        min-height: 9rem;
      }

      .poster img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .quality-badges {
        top: 0.35rem;
        right: 0.35rem;
        gap: 0.2rem;
      }

      .quality-badge {
        font-size: 0.58rem;
        padding: 0.15rem 0.35rem;
      }

      .download-badge.downloaded {
        bottom: 0.35rem;
        left: 0.35rem;
        width: 1.5rem;
        height: 1.5rem;
      }

      .download-badge.downloaded svg {
        width: 0.85rem;
        height: 0.85rem;
      }

      .card-body {
        flex: 1;
        min-width: 0;
        padding: 0.65rem 0.7rem;
        display: flex;
        flex-direction: column;
      }

      .card h2 {
        font-size: 0.95rem;
        -webkit-line-clamp: 2;
      }

      .scraped-title {
        font-size: 0.7rem;
        -webkit-line-clamp: 2;
      }

      .overview {
        -webkit-line-clamp: 2;
        margin-bottom: 0.5rem;
      }

      .links {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: auto;
      }

      .card a {
        font-size: 0.8rem;
      }

      .card-action-btn {
        flex: 1;
        min-width: calc(50% - 0.25rem);
        text-align: center;
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-height: 92vh;
        border-radius: 16px 16px 0 0;
        padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
        overflow-y: auto;
      }

      .download-list {
        max-height: 50vh;
      }

      .download-option {
        min-height: 2.75rem;
        padding: 0.85rem;
        font-size: 0.9rem;
      }

      .state {
        padding: 2rem 0.75rem;
      }
    }

    @media (max-width: 380px) {
      .poster {
        width: 6.5rem;
        min-width: 6.5rem;
        min-height: 8rem;
      }

      .links {
        flex-direction: column;
      }

      .card-action-btn {
        width: 100%;
        min-width: 0;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
    }

    /* ── Downloads view ───────────────────────────────────────────── */
    .downloads-panel {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    .downloads-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .downloads-header h2 {
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
    }

    .downloads-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .downloads-tab {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
    }

    .downloads-tab:hover:not(:disabled) {
      background: rgba(108,140,255,0.08);
      color: var(--text);
    }

    .downloads-tab.active {
      background: rgba(108,140,255,0.14);
      border-color: rgba(108,140,255,0.35);
      color: var(--text);
    }

    .downloads-empty {
      color: var(--muted);
      font-size: 0.875rem;
      padding: 2.5rem 0;
      text-align: center;
    }

    .job-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 0.75rem;
      align-items: start;
    }

    .job-card.active { border-color: rgba(108,140,255,0.4); }
    .job-card.failed { border-color: rgba(255,107,107,0.4); }
    .job-card.completed { border-color: rgba(74,222,128,0.35); }

    .job-title {
      font-size: 0.875rem;
      font-weight: 600;
      word-break: break-word;
      grid-column: 1;
    }

    .job-meta {
      font-size: 0.72rem;
      color: var(--muted);
      grid-column: 1;
      word-break: break-all;
    }

    .job-status-badge {
      grid-column: 2;
      grid-row: 1;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
      align-self: start;
    }

    .job-status-badge.queued  { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .job-status-badge.downloading { background: rgba(108,140,255,0.15); color: var(--accent); border: 1px solid rgba(108,140,255,0.3); }
    .job-status-badge.completed   { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
    .job-status-badge.failed      { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }

    .job-progress-row {
      grid-column: 1 / -1;
    }

    .job-progress-bar {
      height: 5px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.45rem;
    }

    .job-progress-bar span {
      display: block;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
      transition: width 0.3s;
    }

    .job-error {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      color: var(--danger);
      margin-top: 0.25rem;
      word-break: break-word;
    }

    .job-season-row {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .job-actions {
      grid-column: 1 / -1;
      margin-top: 0.35rem;
    }

    .job-redownload-btn {
      font-size: 0.72rem;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      cursor: pointer;
    }

    .job-redownload-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
    }

    .job-redownload-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* nav badge (active download count) */
    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.15rem;
      height: 1.15rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0 0.25rem;
      margin-left: auto;
    }

    .nav-badge[hidden] { display: none; }

    @media (max-width: 768px) {
      .downloads-panel {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-brand">Movie Server</div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-view="library" aria-current="page">
          <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v13A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5v-13Z" />
            <path d="M14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 18.5v-13Z" />
          </svg>
          Library
        </button>
        <button type="button" class="nav-item" data-view="downloads">
          <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3v13M7 11l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 20h16" stroke-linecap="round"/>
          </svg>
          Downloads
          <span class="nav-badge" id="downloads-nav-badge" hidden></span>
        </button>
      </nav>
    </aside>

    <div class="app-main">
      <div class="view" id="view-library">
        <section class="source-config-panel" id="source-config" hidden>
          <div class="source-config-row">
            <label for="main-url-input">Source URL</label>
            <input id="main-url-input" type="url" placeholder="https://filmyfly.luxe/" />
            <button id="apply-main-url" type="button">Apply</button>
          </div>
          <div class="source-config-row">
            <label for="secondary-url-input">Secondary URL (HD only)</label>
            <input id="secondary-url-input" type="url" placeholder="https://… (optional)" />
            <button id="apply-secondary-url" type="button">Apply</button>
          </div>
        </section>

        <section class="filters" id="filters" hidden>
          <div class="filters-panel">
            <div class="filters-row">
              <input id="search-input" type="search" placeholder="Search titles…" />
              <select id="sort-select" aria-label="Sort by">
                <option value="source-order">Source order</option>
                <option value="release-desc">Newest first</option>
                <option value="release-asc">Oldest first</option>
                <option value="rating-desc">Top rated</option>
                <option value="title-asc">Title A–Z</option>
              </select>
              <select id="type-filter" aria-label="Filter by type">
                <option value="all">All types</option>
                <option value="movie">Movies</option>
                <option value="tv">TV Series</option>
              </select>
              <select id="genre-filter" aria-label="Filter by genre">
                <option value="all">All genres</option>
              </select>
              <select id="year-filter" aria-label="Filter by year">
                <option value="all">All years</option>
                <option value="recent">Recent (2 yrs)</option>
              </select>
              <select id="quality-filter" aria-label="Filter by quality">
                <option value="all">All quality</option>
                <option value="hd">HD</option>
                <option value="k4">4K</option>
              </select>
              <button id="refresh" type="button">Refresh</button>
            </div>
            <div class="filter-chips">
              <button class="chip" type="button" data-preset="recent">Recent releases</button>
              <button class="chip" type="button" data-preset="top-rated">Top rated (7+)</button>
              <button class="chip" type="button" data-preset="movies">Movies only</button>
              <button class="chip" type="button" data-preset="tv">TV only</button>
              <button class="chip" type="button" data-preset="hd">HD only</button>
              <button class="chip" type="button" data-preset="k4">4K only</button>
              <button class="chip" type="button" data-preset="reset">Reset filters</button>
            </div>
            <p class="filter-count" id="filter-count"></p>
          </div>
        </section>

        <main>
          <div id="content" class="state"></div>
        </main>

        <footer id="footer" hidden>
          Metadata from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>
        </footer>
      </div>

      <!-- ── Downloads view ─────────────────────────────────────── -->
      <div class="view" id="view-downloads" hidden>
        <section class="downloads-panel">
          <div class="downloads-header">
            <h2>Downloads</h2>
            <button type="button" id="downloads-refresh-btn">Refresh</button>
          </div>
          <div class="downloads-tabs">
            <button type="button" class="downloads-tab active" data-tab="active">Active</button>
            <button type="button" class="downloads-tab" data-tab="all">All jobs</button>
            <button type="button" class="downloads-tab" data-tab="failed">Failed</button>
            <button type="button" class="downloads-tab" data-tab="completed">Completed</button>
          </div>
          <div id="downloads-content" class="downloads-empty">Loading…</div>
        </section>
      </div>

    </div>
  </div>

  <div class="modal-backdrop" id="download-modal" hidden>
    <div class="modal" role="dialog" aria-labelledby="download-modal-title">
      <h2 id="download-modal-title">Download options</h2>
      <div id="download-modal-content" class="download-state">Loading…</div>
      <div class="modal-actions">
        <button class="btn-secondary" id="download-modal-close" type="button">Close</button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    const content = document.getElementById("content");
    const refreshBtn = document.getElementById("refresh");
    const footer = document.getElementById("footer");
    const filtersEl = document.getElementById("filters");
    const sourceConfigEl = document.getElementById("source-config");
    const mainUrlInput = document.getElementById("main-url-input");
    const applyMainUrlBtn = document.getElementById("apply-main-url");
    const secondaryUrlInput = document.getElementById("secondary-url-input");
    const applySecondaryUrlBtn = document.getElementById("apply-secondary-url");
    const viewLibraryEl = document.getElementById("view-library");
    const navItems = document.querySelectorAll(".nav-item[data-view]");
    let activeView = "library";
    let allMovies = [];
    let nextSourceOrder = 0;
    let tmdbEnabledFlag = false;
    let loadGeneration = 0;
    const activePresets = new Set();
    let loadedThroughPage = 0;
    let totalMaxPages = 1;
    let initialPagesCount = 2;
    let sourceSearchTimer = null;
    let sourceSearchGeneration = 0;
    let sourceSearchQuery = "";
    let sourceSearchMovies = [];
    let sourceSearchLoading = false;
    let sourceSearchError = "";

    const searchInput = document.getElementById("search-input");
    const sortSelect = document.getElementById("sort-select");
    const typeFilter = document.getElementById("type-filter");
    const genreFilter = document.getElementById("genre-filter");
    const yearFilter = document.getElementById("year-filter");
    const qualityFilter = document.getElementById("quality-filter");
    const filterCountEl = document.getElementById("filter-count");
    const downloadModal = document.getElementById("download-modal");
    const downloadModalTitle = document.getElementById("download-modal-title");
    const downloadModalContent = document.getElementById("download-modal-content");
    let downloadModalState = { title: "", options: [], movieTitle: "", tmdbId: null };
    const jobPollers = new Map();
    let downloadJobs = [];
    let downloadJobsPoller = null;
    let downloadedTmdbIds = new Set();
    let downloadedTitles = new Set();

    function apiUrl(path) {
      const base = window.MOVIE_SERVER_API_BASE || "";
      return `${base}api/${path.replace(/^\//, "")}`;
    }

    function normalizeTitle(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/\(tmdb-\d+\)/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    async function refreshDownloadLibrary() {
      try {
        const res = await fetch(apiUrl("downloads/library"));
        const data = await res.json();
        if (!res.ok) return;
        downloadedTmdbIds = new Set((data.tmdbIds || []).map(String));
        downloadedTitles = new Set(data.titles || []);
      } catch {
        // Ignore transient failures; downloads still work.
      }
    }

    function isAlreadyDownloaded(movie) {
      const t = movie?.tmdb;
      if (t?.tmdbId && downloadedTmdbIds.has(String(t.tmdbId))) return true;
      const title = t?.tmdbTitle || movie?.title || "";
      const norm = normalizeTitle(title);
      return norm ? downloadedTitles.has(norm) : false;
    }

    async function fetchPageRange(from, to, { refresh = false } = {}) {
      const params = new URLSearchParams({ from: String(from), to: String(to) });
      if (refresh) params.set("refresh", "1");
      const res = await fetch(apiUrl(`movies?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function mergeMovies(incoming) {
      const seen = new Set(allMovies.map((movie) => movie.link));
      for (const movie of incoming) {
        if (!seen.has(movie.link)) {
          seen.add(movie.link);
          allMovies.push({ ...movie, sourceOrder: nextSourceOrder++ });
        }
      }
    }

    async function loadRemainingPages(gen, fromPage, toPage, { refresh = false } = {}) {
      for (let page = fromPage; page <= toPage; page++) {
        if (gen !== loadGeneration) return;

        try {
          const data = await fetchPageRange(page, page, { refresh });
          if (gen !== loadGeneration) return;

          mergeMovies(data.movies || []);
          loadedThroughPage = page;
          tmdbEnabledFlag = data.tmdbEnabled;
          filtersEl.hidden = allMovies.length === 0;
          populateFilterOptions(allMovies);
          applyFiltersAndRender();
        } catch (err) {
          console.error(err);
        }
      }
    }

    function getDisplayTitle(movie) {
      return movie.tmdb?.tmdbTitle || movie.title || "Untitled";
    }

    function getReleaseTime(movie) {
      if (movie.tmdb?.releaseDate) return new Date(movie.tmdb.releaseDate).getTime();
      if (movie.tmdb?.year) return new Date(`${movie.tmdb.year}-01-01`).getTime();
      return 0;
    }

    function populateFilterOptions(movies) {
      const genres = new Set();
      const years = new Set();

      for (const movie of movies) {
        for (const genre of movie.tmdb?.genres || []) genres.add(genre);
        if (movie.tmdb?.year) years.add(movie.tmdb.year);
      }

      const currentGenre = genreFilter.value;
      genreFilter.innerHTML = '<option value="all">All genres</option>';
      [...genres].sort().forEach((genre) => {
        const opt = document.createElement("option");
        opt.value = genre;
        opt.textContent = genre;
        genreFilter.appendChild(opt);
      });
      if ([...genreFilter.options].some((o) => o.value === currentGenre)) {
        genreFilter.value = currentGenre;
      }

      const currentYear = yearFilter.value;
      yearFilter.innerHTML = `
        <option value="all">All years</option>
        <option value="recent">Recent (2 yrs)</option>
      `;
      [...years].sort((a, b) => b - a).forEach((year) => {
        const opt = document.createElement("option");
        opt.value = year;
        opt.textContent = year;
        yearFilter.appendChild(opt);
      });
      if ([...yearFilter.options].some((o) => o.value === currentYear)) {
        yearFilter.value = currentYear;
      }
    }

    async function fetchSourceSearch(query) {
      const params = new URLSearchParams({ q: query });
      const res = await fetch(apiUrl(`movies/search?${params}`));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function scheduleSourceSearch(query) {
      const q = query.trim();
      if (sourceSearchTimer) clearTimeout(sourceSearchTimer);

      if (!q) {
        sourceSearchQuery = "";
        sourceSearchMovies = [];
        sourceSearchLoading = false;
        sourceSearchError = "";
        return;
      }

      // Already fetched this exact query (even if it returned zero hits).
      if (sourceSearchQuery === q) return;

      sourceSearchLoading = true;
      sourceSearchError = "";
      sourceSearchTimer = setTimeout(async () => {
        const gen = ++sourceSearchGeneration;
        try {
          const data = await fetchSourceSearch(q);
          if (gen !== sourceSearchGeneration) return;
          sourceSearchQuery = q;
          sourceSearchMovies = data.movies || [];
          sourceSearchLoading = false;
          sourceSearchError = "";
          mergeMovies(sourceSearchMovies);
          populateFilterOptions(allMovies);
          applyFiltersAndRender({ skipSourceSearch: true });
        } catch (err) {
          if (gen !== sourceSearchGeneration) return;
          sourceSearchQuery = q;
          sourceSearchMovies = [];
          sourceSearchLoading = false;
          sourceSearchError = err.message || "Source search failed";
          applyFiltersAndRender({ skipSourceSearch: true });
        }
      }, 450);
    }

    function applyFiltersAndRender({ skipSourceSearch = false } = {}) {
      let list = [...allMovies];
      const search = searchInput.value.trim().toLowerCase();
      const type = typeFilter.value;
      const genre = genreFilter.value;
      const year = yearFilter.value;
      const quality = qualityFilter.value;
      const sort = sortSelect.value;

      if (search) {
        list = list.filter((m) => getDisplayTitle(m).toLowerCase().includes(search));
      }

      if (type !== "all") {
        list = list.filter((m) => m.tmdb?.type === type);
      }

      if (genre !== "all") {
        list = list.filter((m) => m.tmdb?.genres?.includes(genre));
      }

      if (year === "recent") {
        const cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - 2);
        list = list.filter((m) => {
          const time = getReleaseTime(m);
          return time && time >= cutoff.getTime();
        });
      } else if (year !== "all") {
        list = list.filter((m) => m.tmdb?.year === year);
      }

      if (quality === "hd") {
        list = list.filter((m) => m.quality?.hd);
      } else if (quality === "k4") {
        list = list.filter((m) => m.quality?.k4);
      }

      if (activePresets.has("recent")) {
        const cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - 2);
        list = list.filter((m) => {
          const time = getReleaseTime(m);
          return time && time >= cutoff.getTime();
        });
      }

      if (activePresets.has("top-rated")) {
        list = list.filter((m) => (m.tmdb?.rating || 0) >= 7);
      }

      if (activePresets.has("movies")) {
        list = list.filter((m) => m.tmdb?.type === "movie");
      }

      if (activePresets.has("tv")) {
        list = list.filter((m) => m.tmdb?.type === "tv");
      }

      if (activePresets.has("hd")) {
        list = list.filter((m) => m.quality?.hd);
      }

      if (activePresets.has("k4")) {
        list = list.filter((m) => m.quality?.k4);
      }

      list.sort((a, b) => {
        if (sort === "source-order") return (a.sourceOrder ?? 0) - (b.sourceOrder ?? 0);
        if (sort === "release-desc") return getReleaseTime(b) - getReleaseTime(a);
        if (sort === "release-asc") return getReleaseTime(a) - getReleaseTime(b);
        if (sort === "rating-desc") return (b.tmdb?.rating || 0) - (a.tmdb?.rating || 0);
        return getDisplayTitle(a).localeCompare(getDisplayTitle(b));
      });

      const localSearchHits = search
        ? allMovies.filter((m) => getDisplayTitle(m).toLowerCase().includes(search)).length
        : allMovies.length;

      if (!skipSourceSearch && search && localSearchHits === 0) {
        scheduleSourceSearch(searchInput.value.trim());
      } else if (!search) {
        scheduleSourceSearch("");
      }

      filterCountEl.textContent = `Showing ${list.length} of ${allMovies.length}`;
      if (list.length === 0 && search) {
        if (sourceSearchLoading || (sourceSearchTimer && localSearchHits === 0)) {
          filterCountEl.textContent = `Searching source site for "${searchInput.value.trim()}"…`;
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              No local matches for <strong>${escapeHtml(searchInput.value.trim())}</strong>.
              Searching source sites for more titles…
            </p>`;
        } else if (sourceSearchError && sourceSearchQuery === searchInput.value.trim()) {
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              Source search failed for <strong>${escapeHtml(searchInput.value.trim())}</strong>:
              ${escapeHtml(sourceSearchError)}
            </p>`;
        } else if (loadedThroughPage < totalMaxPages && localSearchHits === 0 && !sourceSearchQuery) {
          filterCountEl.textContent = `No matches yet in ${allMovies.length} loaded · pages ${loadedThroughPage + 1}-${totalMaxPages} loading…`;
          content.className = "state empty";
          content.innerHTML = `
            <p class="empty-hint">
              No results for <strong>${escapeHtml(searchInput.value.trim())}</strong> in loaded pages so far.
              Still fetching pages ${loadedThroughPage + 1}-${totalMaxPages} in the background…
            </p>`;
        } else {
          renderEmptySearch(searchInput.value.trim());
        }
      } else {
        renderMovies(list, tmdbEnabledFlag);
        if (search && sourceSearchQuery === searchInput.value.trim() && sourceSearchMovies.length) {
          filterCountEl.textContent = `Showing ${list.length} of ${allMovies.length} (includes source search)`;
        }
      }

      syncChipActiveStates();
    }

    function syncChipActiveStates() {
      document.querySelectorAll(".chip[data-preset]").forEach((chip) => {
        const preset = chip.dataset.preset;
        if (preset === "reset") return;
        const active = activePresets.has(preset);
        chip.classList.toggle("active", active);
        chip.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function resetFilters() {
      searchInput.value = "";
      sortSelect.value = "source-order";
      typeFilter.value = "all";
      genreFilter.value = "all";
      yearFilter.value = "all";
      qualityFilter.value = "all";
      activePresets.clear();
      syncChipActiveStates();
      applyFiltersAndRender();
    }

    function togglePreset(preset) {
      if (preset === "reset") {
        resetFilters();
        return;
      }

      if (activePresets.has(preset)) {
        activePresets.delete(preset);
      } else {
        if (preset === "movies") activePresets.delete("tv");
        if (preset === "tv") activePresets.delete("movies");
        activePresets.add(preset);
        if (preset === "recent") sortSelect.value = "release-desc";
        if (preset === "top-rated") sortSelect.value = "rating-desc";
      }

      syncChipActiveStates();
      applyFiltersAndRender();
    }
    function renderEmptySearch(searchTerm) {
      const canLoadMore = loadedThroughPage < totalMaxPages;
      const pagesHint = canLoadMore
        ? "Load more pages to search a wider listing."
        : "Increase max_pages in the Home Assistant add-on configuration to fetch more listings.";

      content.className = "state empty";
      content.innerHTML = `
        <div>No results found for <strong>${escapeHtml(searchTerm)}</strong>.</div>
        <p class="empty-hint">
          Searched ${loadedThroughPage} loaded page${loadedThroughPage === 1 ? "" : "s"}.
          ${pagesHint}
        </p>
        <div class="empty-actions">
          <button id="search-deeper" type="button" ${canLoadMore ? "" : "disabled"}>
            Load more pages
          </button>
          <button class="btn-secondary" id="clear-search" type="button">Clear search</button>
        </div>
      `;

      document.getElementById("search-deeper")?.addEventListener("click", async () => {
        const btn = document.getElementById("search-deeper");
        btn.disabled = true;
        btn.textContent = "Loading…";
        const gen = loadGeneration;
        const from = loadedThroughPage + 1;
        const to = Math.min(loadedThroughPage + 3, totalMaxPages);
        await loadRemainingPages(gen, from, to);
        applyFiltersAndRender();
      });

      document.getElementById("clear-search")?.addEventListener("click", () => {
        searchInput.value = "";
        applyFiltersAndRender();
      });
    }

    function renderMovies(movies, tmdbEnabled) {

      content.innerHTML = movies.map((m) => {
        const t = m.tmdb;
        const displayTitle = t?.tmdbTitle || m.title || "Untitled";

          ? `<img src="${escapeAttr(t.poster)}" alt="${escapeAttr(displayTitle)}" loading="lazy" />`

        const qualityBadges = `
          <div class="quality-badges">
            ${m.quality?.k4 ? '<span class="quality-badge k4">4K</span>' : ""}

          </div>`;

        return `
        <article class="card">
          <div class="poster">${poster}${qualityBadges}${renderDownloadedBadge(m, displayTitle)}</div>

              </div>

              ${t.overview ? `<p class="overview">${escapeHtml(t.overview)}</p>` : ""}

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function closeDownloadModal() {
      downloadModal.hidden = true;
      downloadModalState = { title: "", options: [], movieTitle: "", tmdbId: null };
      for (const timer of jobPollers.values()) clearInterval(timer);
      jobPollers.clear();
    }

    function formatJobStatus(job) {
      if (job.type === "season") {
        const done = Number(job.completedEpisodes || 0) + Number(job.skippedEpisodes || 0);
        const total = Number(job.episodeCount || 0);
        if (job.status === "queued") return `Season queued… 0/${total}`;
        if (job.status === "downloading") {
          const current = job.currentEpisode ? ` (E${String(job.currentEpisode).padStart(2, "0")})` : "";
          return `Season… ${done}/${total}${current}`;
        }
        if (job.status === "completed") {
          const failed = Number(job.failedEpisodes || 0);
          return failed ? `Season done (${failed} failed)` : "Season complete";
        }
        if (job.status === "failed") return `Season failed${job.error ? `: ${job.error}` : ""}`;
      }
      if (job.status === "queued") return "Queued…";
      if (job.status === "downloading") {
        if (job.totalBytes > 0) {
          const pct = Math.min(100, Math.round((job.receivedBytes / job.totalBytes) * 100));
          return `Downloading… ${pct}%`;
        }
        return "Downloading…";
      }
      if (job.status === "completed") return "Saved";
      if (job.status === "failed") return `Failed${job.error ? `: ${job.error}` : ""}`;
      return job.status || "";
    }

    function jobProgress(job) {
      if (!job.totalBytes) return 0;
      return Math.min(100, Math.round((job.receivedBytes / job.totalBytes) * 100));
    }

    function latestJobForMovie(title) {
      if (!title) return null;
      return downloadJobs.find((job) => job.movieTitle === title) || null;
    }

    function renderDownloadedBadge(movie, title) {
      const job = latestJobForMovie(title);
      const jobDone = job && job.status === "completed";
      const libraryDone = isAlreadyDownloaded(movie);
      if (!jobDone && !libraryDone) return "";

      const tip = (jobDone && job.filePath) || "Already downloaded";
      return `
        <span class="download-badge downloaded" tabindex="0" aria-label="Downloaded" title="${escapeAttr(tip)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <span class="download-tooltip">${escapeHtml(tip)}</span>
        </span>
      `;
    }

    function renderCardDownloadStatus(title) {
      const job = latestJobForMovie(title);
      if (!job || job.status === "completed") return "";

      const progress = jobProgress(job);

      if (job.status === "failed") {
        const tip = job.error || "Download failed";
        return `
          <div class="card-download-status">
            <span class="download-badge failed" tabindex="0" aria-label="Download failed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
                <circle cx="12" cy="12" r="9"/>
              </svg>
              <span class="download-tooltip">${escapeHtml(tip)}</span>
            </span>
          </div>
        `;
      }

      return `
        <div class="card-download-status">
          <span class="download-active-label">${escapeHtml(formatJobStatus(job))}</span>
          <div class="download-progress thin" style="--progress: ${progress}%"><span></span></div>
        </div>
      `;
    }

    async function refreshDownloadJobs({ rerender = true } = {}) {
      try {
        const res = await fetch(apiUrl("downloads/jobs"));
        const data = await res.json();
        if (!res.ok) return;
        downloadJobs = data.jobs || [];
        if (rerender) applyFiltersAndRender();
        updateDownloadJobsPoller();
      } catch {
        // Ignore transient polling failures.
      }
    }

    function updateDownloadJobsPoller() {
      const hasActiveJobs = downloadJobs.some((job) => job.status === "queued" || job.status === "downloading");
      if (hasActiveJobs && !downloadJobsPoller) {
        downloadJobsPoller = setInterval(() => refreshDownloadJobs(), 2000);
      } else if (!hasActiveJobs && downloadJobsPoller) {
        clearInterval(downloadJobsPoller);
        downloadJobsPoller = null;
      }
    }

    function startJobPolling(jobId, button, label, onComplete) {
      if (jobPollers.has(jobId)) clearInterval(jobPollers.get(jobId));

      const timer = setInterval(async () => {
        try {
          const res = await fetch(apiUrl("downloads/jobs"));
          const data = await res.json();
          const job = data.jobs?.find((item) => item.id === jobId);
          if (!job) return;

          button.textContent = `${label} — ${formatJobStatus(job)}`;

          if (job.status === "completed") {
            button.classList.add("saved");
            button.disabled = true;
            clearInterval(timer);
            jobPollers.delete(jobId);
            if (typeof onComplete === "function") onComplete();
          } else if (job.status === "failed") {
            button.classList.add("failed");
            button.disabled = false;
            clearInterval(timer);
            jobPollers.delete(jobId);
          } else {
            button.disabled = true;
          }
        } catch {
          // keep polling
        }
      }, 1500);

      jobPollers.set(jobId, timer);
    }

    async function startServerDownload(button) {
      const { url, label, movieTitle, tmdbId } = button.dataset;
      button.disabled = true;
      button.textContent = `${label} — Starting…`;

      const res = await fetch(apiUrl("downloads/save"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, label, movieTitle, tmdbId: tmdbId || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);

      button.textContent = `${label} — Queued…`;
      await refreshDownloadJobs();
      startJobPolling(data.job.id, button, label, () => {
        refreshDownloadLibrary().then(() => applyFiltersAndRender());
      });
    }
